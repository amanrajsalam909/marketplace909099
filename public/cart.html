<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart — Rajkot Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #e85d04;
      --primary-dark: #c44e03;
      --primary-light: #fff1e6;
      --dark: #1e293b;
      --text: #334155;
      --muted: #64748b;
      --border: #e2e8f0;
      --bg: #f8fafc;
      --card: #ffffff;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 8px 24px rgba(15, 23, 42, 0.12);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    .header {
      position: sticky; top: 0; z-index: 100;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      max-width: 1000px; margin: 0 auto; padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .brand {
      font-size: 20px; font-weight: 800; color: var(--dark);
      text-decoration: none; letter-spacing: -0.5px;
    }
    .brand span { color: var(--primary); }
    .header a.link { color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 600; }
    .header a.link:hover { color: var(--primary); }

    .container { max-width: 1000px; margin: 0 auto; padding: 28px 20px 60px; }
    h1 { font-size: 24px; font-weight: 800; color: var(--dark); letter-spacing: -0.5px; margin-bottom: 20px; }

    .layout { display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .vendor-group { padding: 18px 18px 6px; border-bottom: 1px solid var(--border); }
    .vendor-group:last-child { border-bottom: none; }
    .vendor-head {
      display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
    }
    .vendor-chip {
      width: 34px; height: 34px; border-radius: 9px;
      background: var(--primary-light); color: var(--primary);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 15px;
    }
    .vendor-title { font-size: 15px; font-weight: 700; color: var(--dark); }
    .vendor-sub { font-size: 12px; color: var(--muted); }

    .cart-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 0; border-top: 1px solid #f1f5f9;
    }
    .item-info { flex: 1; min-width: 0; }
    .item-name { font-size: 14px; font-weight: 600; color: var(--dark); }
    .item-unit { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .stepper {
      display: flex; align-items: center; gap: 0;
      border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
    }
    .stepper button {
      width: 30px; height: 30px; border: none; background: var(--card);
      font-size: 16px; cursor: pointer; color: var(--text); font-family: inherit;
    }
    .stepper button:hover { background: var(--bg); color: var(--primary); }
    .stepper .qty {
      width: 32px; text-align: center; font-size: 13px; font-weight: 700; color: var(--dark);
    }
    .item-total { font-size: 14px; font-weight: 700; color: var(--dark); width: 72px; text-align: right; }
    .remove {
      background: none; border: none; color: #cbd5e1; cursor: pointer;
      font-size: 16px; padding: 4px; font-family: inherit;
    }
    .remove:hover { color: #dc2626; }
    .group-total {
      text-align: right; font-size: 13px; color: var(--muted);
      padding: 10px 0 12px; border-top: 1px solid #f1f5f9;
    }
    .group-total b { color: var(--dark); }

    /* Summary / form */
    .summary-card { padding: 20px; position: sticky; top: 84px; }
    .summary-card h2 { font-size: 16px; font-weight: 700; color: var(--dark); margin-bottom: 14px; }
    .field { margin-bottom: 12px; }
    .field label {
      display: block; font-size: 12px; font-weight: 600; color: var(--muted);
      margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.4px;
    }
    .field input, .field textarea {
      width: 100%; padding: 11px 12px;
      border: 1px solid var(--border); border-radius: 8px;
      font-size: 14px; font-family: inherit; background: var(--bg);
    }
    .field input:focus, .field textarea:focus {
      outline: none; border-color: var(--primary); background: var(--card);
    }
    .field-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    /* Address book chips */
    .book-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .book-chip {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 12px; font-size: 13px; font-weight: 600;
      background: var(--card); cursor: pointer; user-select: none;
    }
    .book-chip:hover { border-color: var(--primary); }
    .book-chip.sel { border-color: var(--primary); background: var(--primary-light); color: var(--dark); }
    .book-x { color: #cbd5e1; font-weight: 700; padding: 0 2px; margin-left: 2px; }
    .book-x:hover { color: #dc2626; }

    /* Area autocomplete (OpenStreetMap) */
    .sug-wrap { position: relative; }
    .sug-list {
      position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px;
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      box-shadow: var(--shadow-lg); z-index: 60; max-height: 220px; overflow-y: auto;
    }
    .sug-item { padding: 9px 12px; font-size: 12px; cursor: pointer; border-bottom: 1px solid #f1f5f9; }
    .sug-item:last-child { border-bottom: none; }
    .sug-item:hover { background: var(--bg); }
    .sug-credit { font-size: 10px; color: var(--muted); margin-top: 3px; }
    .totals { margin: 16px 0; padding-top: 14px; border-top: 1px dashed var(--border); }
    .trow { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 7px; }
    .trow.grand {
      font-size: 17px; font-weight: 800; color: var(--dark);
      padding-top: 10px; margin-top: 4px; border-top: 1px solid var(--border);
    }
    .place-btn {
      width: 100%; padding: 14px;
      background: var(--primary); color: #fff;
      border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700; font-family: inherit;
      cursor: pointer; transition: background 0.15s;
    }
    .place-btn:hover { background: var(--primary-dark); }
    .place-btn:disabled { background: #cbd5e1; cursor: not-allowed; }
    .error-box {
      background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca;
      padding: 11px 14px; border-radius: 8px; font-size: 13px;
      margin-bottom: 14px; display: none;
    }

    /* Empty & success states */
    .state-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 56px 24px; text-align: center;
    }
    .state-card .icon { font-size: 44px; margin-bottom: 12px; }
    .state-card h2 { font-size: 20px; font-weight: 800; color: var(--dark); margin-bottom: 8px; }
    .state-card p { font-size: 14px; color: var(--muted); margin-bottom: 20px; }
    .btn-primary {
      display: inline-block; background: var(--primary); color: #fff;
      padding: 12px 24px; border-radius: 10px; text-decoration: none;
      font-size: 14px; font-weight: 700;
    }
    .btn-primary:hover { background: var(--primary-dark); }
    .order-line {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 12px 16px; margin: 0 auto 10px; max-width: 420px;
      font-size: 13px; text-align: left;
    }
    .order-line b { color: var(--dark); font-size: 13px; }

    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
      .summary-card { position: static; }
    }
    /* Smartphone: stop iOS Safari zooming in when a field is tapped (needs >=16px) */
    html { -webkit-text-size-adjust: 100%; }
    @media (max-width: 600px) {
      input, select, textarea { font-size: 16px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a class="brand" href="/">Rajkot<span>Market</span></a>
      <a class="link" href="/">← Continue shopping</a>
    </div>
  </header>

  <main class="container">
    <h1>Your Cart</h1>
    <div id="view"></div>
  </main>

  <script>
    let cart = JSON.parse(localStorage.getItem('cart') || '[]');
    const view = document.getElementById('view');

    // Per-shop commerce settings (delivery fee, min order, COD/UPI) — display
    // only; the server pipeline independently enforces all of these.
    let shopMeta = {};
    let allOffers = [];
    async function loadMeta() {
      try {
        const [vRes, oRes] = await Promise.all([
          fetch('/api/marketplace?action=vendors'),
          fetch('/api/marketplace?action=offers')
        ]);
        (await vRes.json()).forEach(v => { shopMeta[v.id] = v; });
        if (oRes.ok) allOffers = await oRes.json();
      } catch (_) {}
      render();
    }
    const feeFor = vid => Number(shopMeta[vid]?.delivery_fee ?? 30);
    const minFor = vid => Number(shopMeta[vid]?.min_order ?? 0);

    // Mirrors the database's best-offer selection (largest discount wins) —
    // display only; checkout recomputes and applies the real discount.
    const round2 = n => Math.round(n * 100) / 100;
    function bestOffer(vid, gSub) {
      let best = null, bestD = 0;
      for (const o of allOffers) {
        if (o.vendor_id && o.vendor_id !== vid) continue;
        if (Number(o.min_order) > gSub) continue;
        let d = o.discount_type === 'percent'
          ? round2(gSub * Number(o.discount_value) / 100)
          : Number(o.discount_value);
        if (o.max_discount && d > Number(o.max_discount)) d = Number(o.max_discount);
        if (d > gSub) d = gSub;
        if (d > bestD) { bestD = d; best = o; }
      }
      return best ? { name: best.name, amount: bestD } : null;
    }

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const inr = n => '₹' + Number(n).toLocaleString('en-IN');

    function groups() {
      const g = {};
      cart.forEach((item, idx) => {
        const key = item.vendor_id || 'default';
        if (!g[key]) g[key] = { name: item.vendor_name || 'Local Shop', items: [] };
        g[key].items.push({ ...item, idx });
      });
      return g;
    }

    function render() {
      if (!cart.length) {
        view.innerHTML = `
          <div class="state-card">
            <div class="icon">🛒</div>
            <h2>Your cart is empty</h2>
            <p>Discover Rajkot's local shops and add something you love.</p>
            <a class="btn-primary" href="/">Start Shopping</a>
          </div>`;
        return;
      }

      const g = groups();
      const shopIds = Object.keys(g);
      const vendorCount = shopIds.length;
      const subtotal = cart.reduce((s, i) => s + i.price * i.quantity, 0);
      const delivery = shopIds.reduce((s, vid) => s + feeFor(vid), 0);
      const discount = round2(shopIds.reduce((s, vid) => {
        const gSub = g[vid].items.reduce((x, i) => x + i.price * i.quantity, 0);
        const off = bestOffer(vid, gSub);
        return s + (off ? off.amount : 0);
      }, 0));
      const payable = round2(subtotal + delivery - discount);

      // UPI only offered for single-shop carts where the shop has a UPI ID
      const upiShop = vendorCount === 1 ? shopMeta[shopIds[0]] : null;
      const upiOk = !!(upiShop && upiShop.upi_id);
      const codBlocked = shopIds.filter(vid => shopMeta[vid] && shopMeta[vid].accepts_cod === false);

      const groupsHtml = Object.entries(g).map(([vid, grp]) => {
        const gSub = grp.items.reduce((s, i) => s + i.price * i.quantity, 0);
        const fee = feeFor(vid);
        const minO = minFor(vid);
        const short = minO > gSub ? minO - gSub : 0;
        const off = bestOffer(vid, gSub);
        return `
          <div class="vendor-group">
            <div class="vendor-head">
              <div class="vendor-chip">${esc(grp.name[0])}</div>
              <div>
                <div class="vendor-title">${esc(grp.name)}</div>
                <div class="vendor-sub">${grp.items.length} item${grp.items.length > 1 ? 's' : ''} · delivered separately</div>
              </div>
            </div>
            ${grp.items.map(i => `
              <div class="cart-item">
                <div class="item-info">
                  <div class="item-name">${esc(i.name)}</div>
                  ${i.specs ? `<div class="item-unit" style="color:var(--dark)">${Object.entries(i.specs).map(([k, v]) => esc(k) + ': ' + esc(v)).join(' · ')}</div>` : ''}
                  <div class="item-unit">${inr(i.price)} each</div>
                </div>
                <div class="stepper">
                  <button type="button" data-dec="${i.idx}" aria-label="Decrease">−</button>
                  <span class="qty">${i.quantity}</span>
                  <button type="button" data-inc="${i.idx}" aria-label="Increase">+</button>
                </div>
                <div class="item-total">${inr(i.price * i.quantity)}</div>
                <button type="button" class="remove" data-del="${i.idx}" aria-label="Remove">✕</button>
              </div>
            `).join('')}
            ${short > 0 ? `<div style="background:#fef3c7;color:#92400e;border-radius:8px;padding:9px 12px;font-size:12px;font-weight:600;margin:8px 0">Add ${inr(short)} more — this shop's minimum order is ${inr(minO)}.</div>` : ''}
            ${off ? `<div style="background:#ecfdf5;color:#065f46;border:1px dashed #6ee7b7;border-radius:8px;padding:9px 12px;font-size:12px;font-weight:600;margin:8px 0">🎉 ${esc(off.name)} — ${inr(off.amount)} off, auto-applied at checkout</div>` : ''}
            <div class="group-total">Subtotal ${inr(gSub)} + ${inr(fee)} delivery${off ? ' − ' + inr(off.amount) + ' offer' : ''} = <b>${inr(round2(gSub + fee - (off ? off.amount : 0)))}</b></div>
          </div>`;
      }).join('');

      view.innerHTML = `
        <div class="layout">
          <div class="card">${groupsHtml}</div>
          <div class="card summary-card">
            <h2>Delivery Details</h2>
            <div class="error-box" id="errorBox"></div>
            <form id="checkoutForm" novalidate>
              <div class="field">
                <label for="cName">Full name</label>
                <input id="cName" type="text" autocomplete="name" required>
              </div>
              <div class="field">
                <label for="cPhone">Phone</label>
                <input id="cPhone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="10-digit mobile" required>
              </div>
              <div class="field">
                <label for="cEmail">Email</label>
                <input id="cEmail" type="email" autocomplete="email" required>
              </div>
              ${bookChipsHtml()}
              <div class="field">
                <label for="aFlat">Flat / House No.</label>
                <input id="aFlat" type="text" placeholder="e.g. Flat 302 or House No. 12">
              </div>
              <div class="field">
                <label for="aBldg">Building / Society name</label>
                <input id="aBldg" type="text" placeholder="e.g. Shree Krishna Residency (optional)">
              </div>
              <div class="field">
                <label for="aStreet">Street / Road / Lane</label>
                <input id="aStreet" type="text" placeholder="e.g. Yagnik Road (optional)">
              </div>
              <div class="field sug-wrap">
                <label for="aArea">Area / Locality / Colony / Sector</label>
                <input id="aArea" type="text" placeholder="start typing for suggestions…" autocomplete="off">
                <div class="sug-list" id="sugList" style="display:none"></div>
                <div class="sug-credit">Suggestions © OpenStreetMap contributors</div>
              </div>
              <div class="field">
                <label for="aLandmark">Landmark</label>
                <input id="aLandmark" type="text" placeholder="e.g. near Race Course (optional)">
              </div>
              <div class="field-2col">
                <div class="field">
                  <label for="aCity">City</label>
                  <input id="aCity" type="text" value="Rajkot">
                </div>
                <div class="field">
                  <label for="aPin">PIN Code</label>
                  <input id="aPin" type="text" inputmode="numeric" maxlength="6" placeholder="e.g. 360001">
                </div>
              </div>
              <div class="field">
                <label>Save this address as</label>
                <div class="book-row">
                  ${BOOK_LABELS.map(l => `<div class="book-chip ${saveAsLabel === l ? 'sel' : ''}" data-saveas="${l}">${BOOK_ICONS[l]} ${l}</div>`).join('')}
                </div>
              </div>
              <div class="field">
                <label>Payment method</label>
                <div style="display:flex;gap:8px">
                  <label style="flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;padding:11px 12px;cursor:pointer;font-size:13px;font-weight:600">
                    <input type="radio" name="payMethod" value="COD" checked> 💵 Cash on Delivery
                  </label>
                  <label style="flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;padding:11px 12px;font-size:13px;font-weight:600;${upiOk ? 'cursor:pointer' : 'opacity:0.45'}">
                    <input type="radio" name="payMethod" value="UPI" ${upiOk ? '' : 'disabled'}> 📲 UPI
                  </label>
                </div>
                ${!upiOk && vendorCount > 1 ? '<div style="font-size:11px;color:var(--muted);margin-top:6px">UPI is available when ordering from a single shop.</div>' : ''}
                <div id="upiBox" style="display:none;margin-top:10px;background:#f0f7ff;border:1px solid #bfdbfe;border-radius:8px;padding:12px">
                  <div style="font-size:13px;color:var(--dark)">Pay <b>${inr(payable)}</b> to UPI ID:</div>
                  <div style="display:flex;align-items:center;gap:8px;margin:8px 0">
                    <code style="font-size:14px;font-weight:700;color:var(--dark)" id="upiIdText">${upiOk ? esc(upiShop.upi_id) : ''}</code>
                    <button type="button" id="copyUpi" style="border:1px solid var(--border);background:#fff;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit">Copy</button>
                  </div>
                  <input id="cUtr" type="text" placeholder="UTR / transaction reference (after paying)" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit">
                  <div style="font-size:11px;color:var(--muted);margin-top:6px">Your order is confirmed once the payment is verified.</div>
                </div>
              </div>
              <div class="totals">
                <div class="trow"><span>Items subtotal</span><span>${inr(subtotal)}</span></div>
                <div class="trow"><span>Delivery (${vendorCount} shop${vendorCount > 1 ? 's' : ''})</span><span>${inr(delivery)}</span></div>
                ${discount > 0 ? `<div class="trow" style="color:#047857;font-weight:600"><span>🎉 Offer discount</span><span>−${inr(discount)}</span></div>` : ''}
                <div class="trow grand"><span>Total</span><span>${inr(payable)}</span></div>
              </div>
              <button type="submit" class="place-btn" id="placeBtn">Place Order · ${inr(payable)}</button>
            </form>
          </div>
        </div>`;

      document.getElementById('checkoutForm').addEventListener('submit', placeOrder);

      // Prefill for signed-in customers
      const cust = JSON.parse(localStorage.getItem('custSession') || 'null');
      if (cust) {
        if (cust.name) document.getElementById('cName').value = cust.name;
        if (cust.phone) document.getElementById('cPhone').value = cust.phone;
        if (cust.email) document.getElementById('cEmail').value = cust.email;
      }

      // Restore whatever was typed before this re-render (and the saved
      // address from the last order) — re-rendering must not eat input
      Object.entries(formVals).forEach(([id, v]) => {
        if (id === 'payMethod') return;
        const f = document.getElementById(id);
        if (f) f.value = v;
      });
      if (formVals.payMethod === 'UPI' && upiOk) {
        document.querySelector('input[name="payMethod"][value="UPI"]').checked = true;
        document.getElementById('upiBox').style.display = 'block';
      }

      document.querySelectorAll('input[name="payMethod"]').forEach(r =>
        r.addEventListener('change', () => {
          document.getElementById('upiBox').style.display =
            document.querySelector('input[name="payMethod"]:checked').value === 'UPI' ? 'block' : 'none';
        }));
      const copyBtn = document.getElementById('copyUpi');
      if (copyBtn) copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(document.getElementById('upiIdText').textContent.trim())
          .then(() => { copyBtn.textContent = 'Copied!'; setTimeout(() => copyBtn.textContent = 'Copy', 1500); });
      });
    }

    // Typed form values survive re-renders; seeded with the address used on
    // the customer's last order
    let formVals = JSON.parse(localStorage.getItem('savedAddress') || '{}');

    /* ---- Address book: Home / Office / Other. Signed-in customers sync
       via the server (works across devices); guests keep a local book. ---- */
    const BOOK_LABELS = ['Home', 'Office', 'Other'];
    const BOOK_ICONS = { Home: '🏠', Office: '🏢', Other: '📍' };
    const PART_IDS = { aFlat: 'flat', aBldg: 'building', aStreet: 'street', aArea: 'area', aLandmark: 'landmark', aCity: 'city', aPin: 'pin' };
    let addressBook = JSON.parse(localStorage.getItem('addressBook') || '{}');
    let saveAsLabel = localStorage.getItem('lastAddressLabel') || 'Home';
    const custSess = JSON.parse(localStorage.getItem('custSession') || 'null');

    const custApi = body => fetch('/api/customer-auth', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: custSess.token, ...body })
    });

    async function loadAddressBook() {
      if (!custSess) return;
      try {
        const res = await custApi({ action: 'get-addresses' });
        const d = await res.json();
        if (res.ok && d.addresses && Object.keys(d.addresses).length) {
          addressBook = d.addresses;
          localStorage.setItem('addressBook', JSON.stringify(addressBook));
          autofillAddress();
          render();
        }
      } catch (_) { /* local book remains the fallback */ }
    }

    // Auto-fill the delivery form from the customer's default saved address
    // (their last-used label, else the first saved one). Never clobbers an
    // address they've already started typing or the one from their last order.
    let addrAutofilled = false;
    function autofillAddress() {
      if (addrAutofilled) return;
      const hasInput = ['aFlat', 'aBldg', 'aStreet', 'aArea', 'aLandmark', 'aPin']
        .some(id => formVals[id] && String(formVals[id]).trim());
      if (hasInput) { addrAutofilled = true; return; }
      const label = addressBook[saveAsLabel] ? saveAsLabel : BOOK_LABELS.find(l => addressBook[l]);
      if (!label) return; // nothing saved yet — retry after the server book loads
      const a = addressBook[label];
      Object.entries(PART_IDS).forEach(([id, k]) => { if (a[k]) formVals[id] = a[k]; });
      saveAsLabel = label;
      addrAutofilled = true;
    }

    function composeOneLine(a) {
      return [a.flat, a.building, a.street, a.area, a.landmark ? 'Near ' + a.landmark : '',
        (a.city || '') + (a.pin ? ' - ' + a.pin : '')].filter(Boolean).join(', ');
    }

    function bookChipsHtml() {
      const labels = BOOK_LABELS.filter(l => addressBook[l]);
      if (!labels.length) return '';
      return `
        <div class="field">
          <label>Deliver to a saved address</label>
          <div class="book-row">
            ${labels.map(l => `
              <div class="book-chip" data-book="${l}" title="${esc(composeOneLine(addressBook[l]))}">
                ${BOOK_ICONS[l]} ${l}
                <span class="book-x" data-book-del="${l}" title="Delete ${l} address">✕</span>
              </div>`).join('')}
          </div>
        </div>`;
    }

    function saveToBook(label, parts) {
      addressBook[label] = parts;
      localStorage.setItem('addressBook', JSON.stringify(addressBook));
      localStorage.setItem('lastAddressLabel', label);
      if (custSess) custApi({ action: 'save-address', label, address: parts }).catch(() => {});
    }

    view.addEventListener('input', e => {
      if (!e.target.id) return;
      if (e.target.id === 'aPin') e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
      formVals[e.target.id] = e.target.value;
      if (e.target.id === 'aArea') areaSuggest(e.target.value);
    });
    view.addEventListener('change', e => {
      if (e.target.name === 'payMethod') formVals.payMethod = e.target.value;
    });

    /* ---- Area suggestions via OpenStreetMap (Nominatim) — optional helper;
       picking one fills area, city and PIN. All fields stay editable. ---- */
    let sugTimer, sugItems = [];

    function areaSuggest(q) {
      clearTimeout(sugTimer);
      const hide = () => { const l = document.getElementById('sugList'); if (l) l.style.display = 'none'; };
      if (!q || q.trim().length < 3) return hide();
      sugTimer = setTimeout(async () => {
        try {
          const city = (document.getElementById('aCity') || {}).value.trim() || 'Rajkot';
          const res = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&countrycodes=in&limit=5&q='
            + encodeURIComponent(q.trim() + ', ' + city));
          sugItems = res.ok ? await res.json() : [];
          const el = document.getElementById('sugList');
          if (!el) return;
          if (!sugItems.length) return hide();
          el.innerHTML = sugItems.map((s, i) => `<div class="sug-item" data-sug="${i}">📍 ${esc(s.display_name)}</div>`).join('');
          el.style.display = 'block';
        } catch (_) { hide(); }
      }, 450);
    }

    function setField(id, v) {
      const el = document.getElementById(id);
      if (el && v) { el.value = v; formVals[id] = v; }
    }

    view.addEventListener('click', e => {
      const bookDel = e.target.closest('[data-book-del]');
      if (bookDel) {
        const l = bookDel.dataset.bookDel;
        if (!confirm('Delete your saved ' + l + ' address?')) return;
        delete addressBook[l];
        localStorage.setItem('addressBook', JSON.stringify(addressBook));
        if (custSess) custApi({ action: 'delete-address', label: l }).catch(() => {});
        render();
        return;
      }
      const bookPick = e.target.closest('[data-book]');
      if (bookPick) {
        const l = bookPick.dataset.book;
        const a = addressBook[l];
        if (a) {
          Object.entries(PART_IDS).forEach(([id, k]) => { formVals[id] = a[k] || ''; });
          saveAsLabel = l;
          render();
        }
        return;
      }
      const saveAs = e.target.closest('[data-saveas]');
      if (saveAs) {
        saveAsLabel = saveAs.dataset.saveas;
        localStorage.setItem('lastAddressLabel', saveAsLabel);
        render();
        return;
      }

      const sug = e.target.closest('[data-sug]');
      if (sug) {
        const s = sugItems[+sug.dataset.sug];
        if (s) {
          const a = s.address || {};
          setField('aArea', a.suburb || a.neighbourhood || a.residential || a.quarter || a.village || a.hamlet || s.name);
          setField('aCity', a.city || a.town || a.village || a.state_district);
          setField('aPin', a.postcode);
          if (a.road && !document.getElementById('aStreet').value.trim()) setField('aStreet', a.road);
        }
        document.getElementById('sugList').style.display = 'none';
        return;
      }
      if (!e.target.closest('.sug-wrap')) {
        const l = document.getElementById('sugList');
        if (l) l.style.display = 'none';
      }

      const inc = e.target.closest('[data-inc]');
      const dec = e.target.closest('[data-dec]');
      const del = e.target.closest('[data-del]');
      if (inc) { cart[+inc.dataset.inc].quantity++; save(); }
      else if (dec) {
        const i = +dec.dataset.dec;
        cart[i].quantity--;
        if (cart[i].quantity <= 0) cart.splice(i, 1);
        save();
      }
      else if (del) { cart.splice(+del.dataset.del, 1); save(); }
    });

    function save() {
      localStorage.setItem('cart', JSON.stringify(cart));
      render();
    }

    function showError(msg) {
      const box = document.getElementById('errorBox');
      box.textContent = msg;
      box.style.display = 'block';
      box.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    async function placeOrder(e) {
      e.preventDefault();
      const name = document.getElementById('cName').value.trim();
      const phone = document.getElementById('cPhone').value.trim();
      const email = document.getElementById('cEmail').value.trim();

      const flat = document.getElementById('aFlat').value.trim();
      const bldg = document.getElementById('aBldg').value.trim();
      const street = document.getElementById('aStreet').value.trim();
      const area = document.getElementById('aArea').value.trim();
      const landmark = document.getElementById('aLandmark').value.trim();
      const city = document.getElementById('aCity').value.trim();
      const pin = document.getElementById('aPin').value.trim();

      if (!name || !phone || !email) return showError('Please fill in your name, phone and email.');
      if (!/^\d{10}$/.test(phone.replace(/\D/g, '').slice(-10))) return showError('Please enter a valid 10-digit phone number.');
      if (!/^\S+@\S+\.\S+$/.test(email)) return showError('Please enter a valid email address.');
      if (!flat) return showError('Please enter your flat or house number.');
      if (!area) return showError('Please enter your area / locality.');
      if (!city) return showError('Please enter your city.');
      if (!/^[1-9]\d{5}$/.test(pin)) return showError('Please enter a valid 6-digit PIN code.');

      const address = [
        flat, bldg, street, area,
        landmark ? 'Near ' + landmark : '',
        city + ' - ' + pin
      ].filter(Boolean).join(', ');

      // Pre-flight checks mirrored from the server pipeline (better UX; the
      // database remains the final authority)
      const gNow = groups();
      for (const [vid, grp] of Object.entries(gNow)) {
        const gSub = grp.items.reduce((s, i) => s + i.price * i.quantity, 0);
        if (minFor(vid) > gSub) {
          return showError(`${grp.name}: minimum order is ${inr(minFor(vid))}. Please add ${inr(minFor(vid) - gSub)} more.`);
        }
      }
      const method = (document.querySelector('input[name="payMethod"]:checked') || {}).value === 'UPI' ? 'UPI' : 'COD';
      if (method === 'COD') {
        const noCod = Object.keys(gNow).find(vid => shopMeta[vid] && shopMeta[vid].accepts_cod === false);
        if (noCod) return showError(`${(shopMeta[noCod] || {}).name || 'A shop'} does not accept Cash on Delivery — please pay by UPI.`);
      }

      const btn = document.getElementById('placeBtn');
      btn.disabled = true;
      btn.textContent = 'Placing your order…';

      // One key per checkout attempt set: server guarantees a network retry
      // can never create duplicate orders.
      if (!sessionStorage.getItem('checkoutKey')) {
        sessionStorage.setItem('checkoutKey',
          (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2)));
      }

      try {
        const res = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'place',
            // Only ids + quantities: prices, fees and totals are computed
            // server-side from the database.
            items: cart.map(i => ({ id: i.id, qty: i.quantity })),
            customer: {
              name, phone, email, address,
              address_parts: { flat, building: bldg, street, area, landmark, city, pin }
            },
            payment_method: method,
            utr: (document.getElementById('cUtr') || {}).value || '',
            idempotency_key: sessionStorage.getItem('checkoutKey')
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Could not place the order. Please try again.');

        localStorage.removeItem('cart');
        sessionStorage.removeItem('checkoutKey');
        localStorage.setItem('savedAddress', JSON.stringify({
          aFlat: flat, aBldg: bldg, aStreet: street, aArea: area,
          aLandmark: landmark, aCity: city, aPin: pin
        }));
        saveToBook(saveAsLabel, { flat, building: bldg, street, area, landmark, city, pin });
        renderSuccess(data.orders || [], phone);
      } catch (err) {
        showError(err.message);
        btn.disabled = false;
        btn.textContent = 'Place Order';
      }
    }

    function renderSuccess(orders, phone) {
      const esc2 = esc;
      const saved = round2(orders.reduce((s, o) => s + Number(o.discount || 0), 0));
      view.innerHTML = `
        <div class="state-card">
          <div class="icon">🎉</div>
          <h2>Order placed!</h2>
          <p>A confirmation has been sent to your email. Save your order ID${orders.length > 1 ? 's' : ''} to track delivery.</p>
          ${saved > 0
            ? `<p style="background:#ecfdf5;border:1px solid #a7f3d0;border-radius:8px;padding:10px 14px;font-size:13px;color:#065f46;font-weight:600">🎉 You saved ${inr(saved)} with offers!</p>`
            : ''}
          ${orders.some(o => o.payment_status === 'Pending Verification')
            ? '<p style="background:#f0f7ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px 14px;font-size:13px;color:#1e40af">📲 UPI payment: your order will be confirmed once the payment is verified.</p>'
            : ''}
          ${orders.map(o => `
            <div class="order-line">
              <span><b>${esc2(o.order_id)}</b>${o.vendor_name ? '<br><span style="color:var(--muted);font-size:12px">' + esc2(o.vendor_name) + '</span>' : ''}${Number(o.discount) > 0 ? '<br><span style="color:#047857;font-size:12px;font-weight:600">' + esc2(o.offer_name || 'Offer') + ' · −' + inr(o.discount) + '</span>' : ''}</span>
              <span>${inr(o.total)}</span>
            </div>`).join('')}
          <p style="margin-top:8px">
            <a class="btn-primary" href="track.html${orders.length ? '?orderId=' + encodeURIComponent(orders[0].order_id) + '&phone=' + encodeURIComponent(phone) : ''}">Track Order</a>
          </p>
          <p style="margin-top:14px"><a href="/" style="color:var(--muted)">← Back to shopping</a></p>
        </div>`;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    autofillAddress();
    render();
    loadMeta();
    loadAddressBook();
  </script>
</body>
</html>
