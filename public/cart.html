<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart — Rajkot Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #e85d04;
      --primary-dark: #c44e03;
      --primary-light: #fff1e6;
      --dark: #1e293b;
      --text: #334155;
      --muted: #64748b;
      --border: #e2e8f0;
      --bg: #f8fafc;
      --card: #ffffff;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 8px 24px rgba(15, 23, 42, 0.12);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    .header {
      position: sticky; top: 0; z-index: 100;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      max-width: 1000px; margin: 0 auto; padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .brand {
      font-size: 20px; font-weight: 800; color: var(--dark);
      text-decoration: none; letter-spacing: -0.5px;
    }
    .brand span { color: var(--primary); }
    .header a.link { color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 600; }
    .header a.link:hover { color: var(--primary); }

    .container { max-width: 1000px; margin: 0 auto; padding: 28px 20px 60px; }
    h1 { font-size: 24px; font-weight: 800; color: var(--dark); letter-spacing: -0.5px; margin-bottom: 20px; }

    .layout { display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .vendor-group { padding: 18px 18px 6px; border-bottom: 1px solid var(--border); }
    .vendor-group:last-child { border-bottom: none; }
    .vendor-head {
      display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
    }
    .vendor-chip {
      width: 34px; height: 34px; border-radius: 9px;
      background: var(--primary-light); color: var(--primary);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 15px;
    }
    .vendor-title { font-size: 15px; font-weight: 700; color: var(--dark); }
    .vendor-sub { font-size: 12px; color: var(--muted); }

    .cart-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 0; border-top: 1px solid #f1f5f9;
    }
    .item-info { flex: 1; min-width: 0; }
    .item-name { font-size: 14px; font-weight: 600; color: var(--dark); }
    .item-unit { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .stepper {
      display: flex; align-items: center; gap: 0;
      border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
    }
    .stepper button {
      width: 30px; height: 30px; border: none; background: var(--card);
      font-size: 16px; cursor: pointer; color: var(--text); font-family: inherit;
    }
    .stepper button:hover { background: var(--bg); color: var(--primary); }
    .stepper .qty {
      width: 32px; text-align: center; font-size: 13px; font-weight: 700; color: var(--dark);
    }
    .item-total { font-size: 14px; font-weight: 700; color: var(--dark); width: 72px; text-align: right; }
    .remove {
      background: none; border: none; color: #cbd5e1; cursor: pointer;
      font-size: 16px; padding: 4px; font-family: inherit;
    }
    .remove:hover { color: #dc2626; }
    .group-total {
      text-align: right; font-size: 13px; color: var(--muted);
      padding: 10px 0 12px; border-top: 1px solid #f1f5f9;
    }
    .group-total b { color: var(--dark); }

    /* Summary / form */
    .summary-card { padding: 20px; position: sticky; top: 84px; }
    .summary-card h2 { font-size: 16px; font-weight: 700; color: var(--dark); margin-bottom: 14px; }
    .field { margin-bottom: 12px; }
    .field label {
      display: block; font-size: 12px; font-weight: 600; color: var(--muted);
      margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.4px;
    }
    .field input, .field textarea {
      width: 100%; padding: 11px 12px;
      border: 1px solid var(--border); border-radius: 8px;
      font-size: 14px; font-family: inherit; background: var(--bg);
    }
    .field input:focus, .field textarea:focus {
      outline: none; border-color: var(--primary); background: var(--card);
    }
    .totals { margin: 16px 0; padding-top: 14px; border-top: 1px dashed var(--border); }
    .trow { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 7px; }
    .trow.grand {
      font-size: 17px; font-weight: 800; color: var(--dark);
      padding-top: 10px; margin-top: 4px; border-top: 1px solid var(--border);
    }
    .place-btn {
      width: 100%; padding: 14px;
      background: var(--primary); color: #fff;
      border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700; font-family: inherit;
      cursor: pointer; transition: background 0.15s;
    }
    .place-btn:hover { background: var(--primary-dark); }
    .place-btn:disabled { background: #cbd5e1; cursor: not-allowed; }
    .error-box {
      background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca;
      padding: 11px 14px; border-radius: 8px; font-size: 13px;
      margin-bottom: 14px; display: none;
    }

    /* Empty & success states */
    .state-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 56px 24px; text-align: center;
    }
    .state-card .icon { font-size: 44px; margin-bottom: 12px; }
    .state-card h2 { font-size: 20px; font-weight: 800; color: var(--dark); margin-bottom: 8px; }
    .state-card p { font-size: 14px; color: var(--muted); margin-bottom: 20px; }
    .btn-primary {
      display: inline-block; background: var(--primary); color: #fff;
      padding: 12px 24px; border-radius: 10px; text-decoration: none;
      font-size: 14px; font-weight: 700;
    }
    .btn-primary:hover { background: var(--primary-dark); }
    .order-line {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 12px 16px; margin: 0 auto 10px; max-width: 420px;
      font-size: 13px; text-align: left;
    }
    .order-line b { color: var(--dark); font-size: 13px; }

    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
      .summary-card { position: static; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a class="brand" href="/">Rajkot<span>Market</span></a>
      <a class="link" href="/">← Continue shopping</a>
    </div>
  </header>

  <main class="container">
    <h1>Your Cart</h1>
    <div id="view"></div>
  </main>

  <script>
    const DELIVERY_FEE = 30;
    let cart = JSON.parse(localStorage.getItem('cart') || '[]');
    const view = document.getElementById('view');

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const inr = n => '₹' + Number(n).toLocaleString('en-IN');

    function groups() {
      const g = {};
      cart.forEach((item, idx) => {
        const key = item.vendor_id || 'default';
        if (!g[key]) g[key] = { name: item.vendor_name || 'Local Shop', items: [] };
        g[key].items.push({ ...item, idx });
      });
      return g;
    }

    function render() {
      if (!cart.length) {
        view.innerHTML = `
          <div class="state-card">
            <div class="icon">🛒</div>
            <h2>Your cart is empty</h2>
            <p>Discover Rajkot's local shops and add something you love.</p>
            <a class="btn-primary" href="/">Start Shopping</a>
          </div>`;
        return;
      }

      const g = groups();
      const vendorCount = Object.keys(g).length;
      const subtotal = cart.reduce((s, i) => s + i.price * i.quantity, 0);
      const delivery = vendorCount * DELIVERY_FEE;

      const groupsHtml = Object.entries(g).map(([vid, grp]) => {
        const gSub = grp.items.reduce((s, i) => s + i.price * i.quantity, 0);
        return `
          <div class="vendor-group">
            <div class="vendor-head">
              <div class="vendor-chip">${esc(grp.name[0])}</div>
              <div>
                <div class="vendor-title">${esc(grp.name)}</div>
                <div class="vendor-sub">${grp.items.length} item${grp.items.length > 1 ? 's' : ''} · delivered separately</div>
              </div>
            </div>
            ${grp.items.map(i => `
              <div class="cart-item">
                <div class="item-info">
                  <div class="item-name">${esc(i.name)}</div>
                  <div class="item-unit">${inr(i.price)} each</div>
                </div>
                <div class="stepper">
                  <button type="button" data-dec="${i.idx}" aria-label="Decrease">−</button>
                  <span class="qty">${i.quantity}</span>
                  <button type="button" data-inc="${i.idx}" aria-label="Increase">+</button>
                </div>
                <div class="item-total">${inr(i.price * i.quantity)}</div>
                <button type="button" class="remove" data-del="${i.idx}" aria-label="Remove">✕</button>
              </div>
            `).join('')}
            <div class="group-total">Subtotal ${inr(gSub)} + ${inr(DELIVERY_FEE)} delivery = <b>${inr(gSub + DELIVERY_FEE)}</b></div>
          </div>`;
      }).join('');

      view.innerHTML = `
        <div class="layout">
          <div class="card">${groupsHtml}</div>
          <div class="card summary-card">
            <h2>Delivery Details</h2>
            <div class="error-box" id="errorBox"></div>
            <form id="checkoutForm" novalidate>
              <div class="field">
                <label for="cName">Full name</label>
                <input id="cName" type="text" autocomplete="name" required>
              </div>
              <div class="field">
                <label for="cPhone">Phone</label>
                <input id="cPhone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="10-digit mobile" required>
              </div>
              <div class="field">
                <label for="cEmail">Email</label>
                <input id="cEmail" type="email" autocomplete="email" required>
              </div>
              <div class="field">
                <label for="cAddress">Delivery address</label>
                <textarea id="cAddress" rows="2" autocomplete="street-address" required></textarea>
              </div>
              <div class="totals">
                <div class="trow"><span>Items subtotal</span><span>${inr(subtotal)}</span></div>
                <div class="trow"><span>Delivery (${vendorCount} shop${vendorCount > 1 ? 's' : ''} × ${inr(DELIVERY_FEE)})</span><span>${inr(delivery)}</span></div>
                <div class="trow grand"><span>Total</span><span>${inr(subtotal + delivery)}</span></div>
              </div>
              <button type="submit" class="place-btn" id="placeBtn">Place Order · ${inr(subtotal + delivery)}</button>
            </form>
          </div>
        </div>`;

      document.getElementById('checkoutForm').addEventListener('submit', placeOrder);
    }

    view.addEventListener('click', e => {
      const inc = e.target.closest('[data-inc]');
      const dec = e.target.closest('[data-dec]');
      const del = e.target.closest('[data-del]');
      if (inc) { cart[+inc.dataset.inc].quantity++; save(); }
      else if (dec) {
        const i = +dec.dataset.dec;
        cart[i].quantity--;
        if (cart[i].quantity <= 0) cart.splice(i, 1);
        save();
      }
      else if (del) { cart.splice(+del.dataset.del, 1); save(); }
    });

    function save() {
      localStorage.setItem('cart', JSON.stringify(cart));
      render();
    }

    function showError(msg) {
      const box = document.getElementById('errorBox');
      box.textContent = msg;
      box.style.display = 'block';
      box.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    async function placeOrder(e) {
      e.preventDefault();
      const name = document.getElementById('cName').value.trim();
      const phone = document.getElementById('cPhone').value.trim();
      const email = document.getElementById('cEmail').value.trim();
      const address = document.getElementById('cAddress').value.trim();

      if (!name || !phone || !email || !address) return showError('Please fill in all the delivery details.');
      if (!/^\d{10}$/.test(phone.replace(/\D/g, '').slice(-10))) return showError('Please enter a valid 10-digit phone number.');
      if (!/^\S+@\S+\.\S+$/.test(email)) return showError('Please enter a valid email address.');

      const btn = document.getElementById('placeBtn');
      btn.disabled = true;
      btn.textContent = 'Placing your order…';

      // One key per checkout attempt set: server guarantees a network retry
      // can never create duplicate orders.
      if (!sessionStorage.getItem('checkoutKey')) {
        sessionStorage.setItem('checkoutKey',
          (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2)));
      }

      try {
        const res = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'place',
            // Only ids + quantities: prices, fees and totals are computed
            // server-side from the database.
            items: cart.map(i => ({ id: i.id, qty: i.quantity })),
            customer: { name, phone, email, address },
            payment_method: 'COD',
            idempotency_key: sessionStorage.getItem('checkoutKey')
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Could not place the order. Please try again.');

        localStorage.removeItem('cart');
        sessionStorage.removeItem('checkoutKey');
        renderSuccess(data.orders || [], phone);
      } catch (err) {
        showError(err.message);
        btn.disabled = false;
        btn.textContent = 'Place Order';
      }
    }

    function renderSuccess(orders, phone) {
      const esc2 = esc;
      view.innerHTML = `
        <div class="state-card">
          <div class="icon">🎉</div>
          <h2>Order placed!</h2>
          <p>A confirmation has been sent to your email. Save your order ID${orders.length > 1 ? 's' : ''} to track delivery.</p>
          ${orders.map(o => `
            <div class="order-line">
              <span><b>${esc2(o.order_id)}</b>${o.vendor_name ? '<br><span style="color:var(--muted);font-size:12px">' + esc2(o.vendor_name) + '</span>' : ''}</span>
              <span>${inr(o.total)}</span>
            </div>`).join('')}
          <p style="margin-top:8px">
            <a class="btn-primary" href="track.html${orders.length ? '?orderId=' + encodeURIComponent(orders[0].order_id) + '&phone=' + encodeURIComponent(phone) : ''}">Track Order</a>
          </p>
          <p style="margin-top:14px"><a href="/" style="color:var(--muted)">← Back to shopping</a></p>
        </div>`;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    render();
  </script>
</body>
</html>
