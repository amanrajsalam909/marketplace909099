<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendor Dashboard — Rajkot Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #e85d04;
      --primary-dark: #c44e03;
      --primary-light: #fff1e6;
      --dark: #1e293b;
      --darker: #0f172a;
      --text: #334155;
      --muted: #64748b;
      --border: #e2e8f0;
      --bg: #f8fafc;
      --card: #ffffff;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
      --green: #059669;
      --amber: #d97706;
      --blue: #2563eb;
      --red: #dc2626;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* Topbar */
    .topbar { background: var(--darker); color: #fff; }
    .topbar-inner {
      max-width: 1100px; margin: 0 auto; padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .brand { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; color: #fff; text-decoration: none; }
    .brand span { color: #fb923c; }
    .topbar-right { display: flex; align-items: center; gap: 14px; }
    .vendor-label { font-size: 13px; color: #94a3b8; }
    .vendor-label b { color: #fff; font-weight: 700; }
    .logout-btn {
      background: rgba(255,255,255,0.1); color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 7px 14px; border-radius: 8px;
      font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer;
    }
    .logout-btn:hover { background: rgba(255,255,255,0.18); }

    .container { max-width: 1100px; margin: 0 auto; padding: 24px 20px 60px; }

    /* Stats */
    .stats {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
      margin-bottom: 24px;
    }
    .stat {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow);
    }
    .stat .label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
    .stat .value { font-size: 26px; font-weight: 800; color: var(--dark); margin-top: 6px; letter-spacing: -0.5px; }
    .stat .value.orange { color: var(--primary); }
    .stat .value.green { color: var(--green); }
    .stat .value.amber { color: var(--amber); }

    /* Tabs */
    .tabs {
      display: flex; gap: 4px; margin-bottom: 18px;
      background: #eef2f7; padding: 4px; border-radius: 10px; width: fit-content;
    }
    .tab {
      padding: 8px 20px; border: none; background: transparent;
      font-size: 14px; font-weight: 600; color: var(--muted);
      border-radius: 8px; cursor: pointer; font-family: inherit;
      transition: all 0.15s;
    }
    .tab.active { background: var(--card); color: var(--dark); box-shadow: var(--shadow); }

    .panel { display: none; }
    .panel.active { display: block; }

    /* Filter chips */
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .chip {
      padding: 7px 14px; border: 1px solid var(--border); background: var(--card);
      border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted);
      cursor: pointer; font-family: inherit; transition: all 0.15s;
    }
    .chip.active { background: var(--dark); color: #fff; border-color: var(--dark); }

    /* Order cards */
    .orders { display: grid; gap: 14px; }
    .order-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow);
    }
    .order-top {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 8px; margin-bottom: 12px;
    }
    .order-id { font-size: 15px; font-weight: 800; color: var(--dark); }
    .order-time { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .pill {
      padding: 5px 12px; border-radius: 999px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
    }
    .pill.pending   { background: #fef3c7; color: #92400e; }
    .pill.confirmed { background: #dbeafe; color: #1e40af; }
    .pill.preparing { background: #ffedd5; color: #9a3412; }
    .pill.ready     { background: #e0e7ff; color: #3730a3; }
    .pill.delivered { background: #d1fae5; color: #065f46; }
    .pill.cancelled { background: #fee2e2; color: #991b1b; }
    .pay-tag { font-size: 12px; color: var(--muted); font-weight: 600; }
    .cancel-link {
      background: none; border: none; color: var(--red);
      font-size: 12px; font-weight: 600; font-family: inherit;
      cursor: pointer; padding: 8px 4px;
    }
    .cancel-link:hover { text-decoration: underline; }

    .order-meta {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px; padding: 12px 0; border-top: 1px solid #f1f5f9; font-size: 13px;
    }
    .meta-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
    .meta-value { color: var(--dark); font-weight: 600; margin-top: 2px; word-break: break-word; }

    .order-items {
      background: var(--bg); border-radius: 8px; padding: 10px 14px; margin: 4px 0 12px;
    }
    .oitem { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; }
    .order-bottom { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .order-total { font-size: 17px; font-weight: 800; color: var(--dark); }
    .advance-btn {
      background: var(--primary); color: #fff; border: none;
      padding: 10px 18px; border-radius: 8px;
      font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer;
    }
    .advance-btn:hover { background: var(--primary-dark); }
    .advance-btn:disabled { background: #cbd5e1; cursor: not-allowed; }
    .done-tag { font-size: 13px; font-weight: 700; color: var(--green); }

    /* Products */
    .products-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    .add-product-btn {
      background: var(--primary); color: #fff; border: none;
      padding: 10px 18px; border-radius: 8px;
      font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer;
    }
    .add-product-btn:hover { background: var(--primary-dark); }
    .product-form {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px; margin-bottom: 18px;
      display: none;
    }
    .product-form.open { display: block; }
    .product-form h3 { font-size: 15px; font-weight: 700; color: var(--dark); margin-bottom: 14px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-grid .full { grid-column: 1 / -1; }
    .product-form label {
      display: block; font-size: 12px; font-weight: 600; color: var(--muted);
      margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.4px;
    }
    .product-form input, .product-form textarea {
      width: 100%; padding: 10px 12px;
      border: 1px solid var(--border); border-radius: 8px;
      font-size: 14px; font-family: inherit; background: var(--bg);
    }
    .product-form input:focus, .product-form textarea:focus {
      outline: none; border-color: var(--primary); background: var(--card);
    }
    .form-actions { display: flex; gap: 10px; margin-top: 14px; }
    .save-btn {
      background: var(--primary); color: #fff; border: none;
      padding: 10px 22px; border-radius: 8px;
      font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer;
    }
    .save-btn:hover { background: var(--primary-dark); }
    .cancel-btn {
      background: var(--card); color: var(--muted); border: 1px solid var(--border);
      padding: 10px 18px; border-radius: 8px;
      font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer;
    }

    .product-list { display: grid; gap: 10px; }
    .product-row {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 18px;
      display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow);
    }
    .p-thumb {
      width: 44px; height: 44px; border-radius: 9px; flex-shrink: 0;
      background: var(--primary-light);
      display: flex; align-items: center; justify-content: center; font-size: 20px;
      overflow: hidden;
    }
    .p-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .p-info { flex: 1; min-width: 0; }
    .p-name { font-size: 14px; font-weight: 700; color: var(--dark); }
    .p-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .p-price { font-size: 15px; font-weight: 800; color: var(--dark); white-space: nowrap; }
    .icon-btn {
      border: 1px solid var(--border); background: var(--card);
      padding: 7px 13px; border-radius: 8px;
      font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer; color: var(--text);
    }
    .icon-btn:hover { border-color: var(--primary); color: var(--primary); }
    .icon-btn.danger:hover { border-color: var(--red); color: var(--red); }

    .state { text-align: center; padding: 48px 20px; color: var(--muted); font-size: 14px; }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--dark); color: #fff;
      padding: 12px 22px; border-radius: 999px;
      font-size: 14px; font-weight: 600;
      transition: transform 0.25s ease; z-index: 200;
      max-width: calc(100vw - 40px);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 760px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .form-grid { grid-template-columns: 1fr; }
      .vendor-label { display: none; }
      .product-row { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">Rajkot<span>Market</span></a>
      <div class="topbar-right">
        <div class="vendor-label">Signed in as <b id="vendorName">Vendor</b></div>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </div>
  </div>

  <main class="container">
    <div class="stats">
      <div class="stat"><div class="label">Total Orders</div><div class="value" id="statOrders">—</div></div>
      <div class="stat"><div class="label">Revenue</div><div class="value green" id="statRevenue">—</div></div>
      <div class="stat"><div class="label">Pending</div><div class="value amber" id="statPending">—</div></div>
      <div class="stat"><div class="label">Menu Items</div><div class="value orange" id="statProducts">—</div></div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="orders">Orders</button>
      <button class="tab" data-tab="products">Products</button>
      <button class="tab" data-tab="accounting">Accounting</button>
      <button class="tab" data-tab="settings">Shop Settings</button>
    </div>

    <section class="panel active" id="panel-orders">
      <div class="chips" id="chips">
        <button class="chip active" data-status="">All</button>
        <button class="chip" data-status="pending">Pending</button>
        <button class="chip" data-status="confirmed">Confirmed</button>
        <button class="chip" data-status="preparing">Preparing</button>
        <button class="chip" data-status="ready">Out for Delivery</button>
        <button class="chip" data-status="delivered">Delivered</button>
        <button class="chip" data-status="cancelled">Cancelled</button>
      </div>
      <div class="orders" id="ordersList"><div class="state">Loading orders…</div></div>
    </section>

    <section class="panel" id="panel-products">
      <div class="products-head">
        <div style="font-size:15px;font-weight:700;color:var(--dark)">Your Menu</div>
        <button class="add-product-btn" id="toggleFormBtn">+ Add Product</button>
      </div>

      <div class="product-form" id="productForm">
        <h3 id="formTitle">Add a new product</h3>
        <form id="pForm">
          <input type="hidden" id="pId">
          <div class="form-grid">
            <div><label for="pName">Name</label><input id="pName" type="text" required></div>
            <div><label for="pCategory">Category</label><input id="pCategory" type="text" placeholder="e.g. Main Course" required></div>
            <div><label for="pPrice">Price (₹)</label><input id="pPrice" type="number" min="1" step="0.01" required></div>
            <div><label for="pStock">Stock (units available)</label><input id="pStock" type="number" min="0" step="1" value="0" required></div>
            <div class="full"><label for="pImage">Image URL (optional)</label><input id="pImage" type="url" placeholder="https://…"></div>
            <div class="full"><label for="pDesc">Description</label><textarea id="pDesc" rows="2"></textarea></div>
          </div>
          <div class="form-actions">
            <button type="submit" class="save-btn" id="saveBtn">Save Product</button>
            <button type="button" class="cancel-btn" id="cancelBtn">Cancel</button>
          </div>
        </form>
      </div>

      <div class="product-list" id="productsList"><div class="state">Loading products…</div></div>
    </section>

    <section class="panel" id="panel-accounting">
      <div class="chips" id="accChips">
        <button class="chip active" data-days="0">Today</button>
        <button class="chip" data-days="7">7 Days</button>
        <button class="chip" data-days="30">30 Days</button>
        <button class="chip" data-days="">All Time</button>
      </div>
      <div id="accBody"><div class="state">Loading accounts…</div></div>
    </section>

    <section class="panel" id="panel-settings">
      <div class="product-form open" style="display:block" id="settingsCard">
        <h3>Shop Settings</h3>
        <form id="settingsForm">
          <div class="form-grid">
            <div class="full" style="display:flex;align-items:center;gap:10px;padding:12px;background:var(--bg);border-radius:8px">
              <input type="checkbox" id="sOpen" style="width:18px;height:18px">
              <label for="sOpen" style="margin:0;text-transform:none;font-size:14px;color:var(--dark)">Shop is accepting orders</label>
            </div>
            <div><label for="sOpenTime">Opens at (blank = 24×7)</label><input id="sOpenTime" type="time"></div>
            <div><label for="sCloseTime">Closes at</label><input id="sCloseTime" type="time"></div>
            <div class="full">
              <label>Open days</label>
              <div id="sDays" style="display:flex;gap:6px;flex-wrap:wrap"></div>
            </div>
            <div><label for="sDeliveryFee">Delivery fee (₹)</label><input id="sDeliveryFee" type="number" min="0" max="500" step="1"></div>
            <div><label for="sMinOrder">Minimum order (₹, 0 = none)</label><input id="sMinOrder" type="number" min="0" step="1"></div>
            <div class="full" style="display:flex;align-items:center;gap:10px;padding:12px;background:var(--bg);border-radius:8px">
              <input type="checkbox" id="sCod" style="width:18px;height:18px">
              <label for="sCod" style="margin:0;text-transform:none;font-size:14px;color:var(--dark)">Accept Cash on Delivery</label>
            </div>
            <div class="full"><label for="sUpi">UPI ID (for online payments, e.g. shop@okhdfcbank)</label><input id="sUpi" type="text" placeholder="leave blank to disable UPI"></div>
            <div><label for="sPhone">Shop phone</label><input id="sPhone" type="tel"></div>
            <div><label for="sAddress">Address</label><input id="sAddress" type="text"></div>
            <div class="full"><label for="sDesc">Shop description</label><textarea id="sDesc" rows="2"></textarea></div>
          </div>
          <div class="form-actions">
            <button type="submit" class="save-btn" id="sSaveBtn">Save Settings</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const STATUS_FLOW = ['pending', 'confirmed', 'preparing', 'ready', 'delivered'];
    const STATUS_LABELS = { pending: 'Pending', confirmed: 'Confirmed', preparing: 'Preparing', ready: 'Out for Delivery', delivered: 'Delivered', cancelled: 'Cancelled' };
    const NEXT_LABEL = { pending: 'Confirm Order', confirmed: 'Start Preparing', preparing: 'Mark Out for Delivery', ready: 'Mark Delivered' };

    const token = localStorage.getItem('vendorToken');
    const vendor = JSON.parse(localStorage.getItem('vendor') || '{}');
    if (!token) location.href = 'vendor-login.html';

    document.getElementById('vendorName').textContent = vendor.name || 'Vendor';

    let allOrders = [];
    let allProducts = [];
    let statusFilter = '';

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const inr = n => '₹' + Number(n).toLocaleString('en-IN');

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 2200);
    }

    function authFail() {
      localStorage.removeItem('vendorToken');
      localStorage.removeItem('vendor');
      location.href = 'vendor-login.html';
    }

    function logout() {
      fetch('/api/vendor-auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'logout', token })
      }).finally(authFail);
    }

    /* ---------- Orders ---------- */
    async function loadOrders() {
      try {
        const res = await fetch('/api/vendor-orders?token=' + encodeURIComponent(token));
        if (res.status === 401) return authFail();
        allOrders = await res.json();
        if (!Array.isArray(allOrders)) allOrders = [];
        renderOrders();
        renderStats();
      } catch (e) {
        document.getElementById('ordersList').innerHTML = '<div class="state">Could not load orders. Refresh to retry.</div>';
      }
    }

    function renderOrders() {
      const list = statusFilter ? allOrders.filter(o => o.status === statusFilter) : allOrders;
      const el = document.getElementById('ordersList');

      if (!list.length) {
        el.innerHTML = '<div class="state">No ' + (statusFilter ? STATUS_LABELS[statusFilter].toLowerCase() + ' ' : '') + 'orders yet.</div>';
        return;
      }

      el.innerHTML = list.map(o => {
        const items = o.items || [];
        const when = o.created_at ? new Date(o.created_at).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' }) : '';
        return `
          <div class="order-card">
            <div class="order-top">
              <div>
                <div class="order-id">${esc(o.order_id)}</div>
                <div class="order-time">${esc(when)}</div>
              </div>
              <span class="pill ${esc(o.status)}">${STATUS_LABELS[o.status] || esc(o.status)}</span>
            </div>
            <div class="order-meta">
              <div><div class="meta-label">Customer</div><div class="meta-value">${esc(o.customer_name)}</div></div>
              <div><div class="meta-label">Phone</div><div class="meta-value">${esc(o.customer_phone)}</div></div>
              <div><div class="meta-label">Address</div><div class="meta-value">${esc(o.delivery_address)}</div></div>
            </div>
            <div class="order-items">
              ${items.map(i => `<div class="oitem"><span>${esc(i.name)} × ${i.quantity}</span><span>${inr(i.price * i.quantity)}</span></div>`).join('')}
            </div>
            <div class="order-bottom">
              <div>
                <div class="order-total">${inr(o.total)}</div>
                <div class="pay-tag">${esc(o.payment_method || 'COD')} · ${esc(o.payment_status || '')}</div>
              </div>
              <div style="display:flex;align-items:center;gap:10px">
                ${['pending', 'confirmed'].includes(o.status)
                  ? `<button class="cancel-link" data-cancel="${esc(o.order_id)}">Cancel order</button>` : ''}
                ${o.status === 'delivered'
                  ? `<span class="done-tag">✓ Completed${o.delivery_proof ? '<br><span class="pay-tag" style="font-weight:600">' + esc(o.delivery_proof) + (o.delivered_at ? ' · ' + new Date(o.delivered_at).toLocaleString('en-IN', { dateStyle: 'short', timeStyle: 'short' }) : '') + '</span>' : ''}</span>`
                  : o.status === 'cancelled'
                    ? '<span class="pay-tag">Stock restored</span>'
                    : o.status === 'ready'
                      ? '<span class="pay-tag">🛵 With delivery partner</span>'
                      : `<button class="advance-btn" data-advance="${esc(o.order_id)}" data-status="${esc(o.status)}">${NEXT_LABEL[o.status] || 'Advance'}</button>`}
              </div>
            </div>
          </div>`;
      }).join('');
    }

    document.getElementById('ordersList').addEventListener('click', async e => {
      const cancelBtn = e.target.closest('[data-cancel]');
      if (cancelBtn) {
        const reason = prompt('Cancel this order? The customer will be emailed and stock restored.\nOptional reason:');
        if (reason === null) return;
        try {
          const res = await fetch('/api/vendor-orders?token=' + encodeURIComponent(token), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, action: 'cancel', orderId: cancelBtn.dataset.cancel, reason })
          });
          const data = await res.json();
          if (!res.ok || !data.success) throw new Error(data.error || 'Cancel failed');
          toast('Order cancelled, stock restored');
          loadOrders();
          loadProducts();
        } catch (err) {
          toast('Could not cancel: ' + err.message);
        }
        return;
      }

      const btn = e.target.closest('[data-advance]');
      if (!btn) return;
      const next = STATUS_FLOW[STATUS_FLOW.indexOf(btn.dataset.status) + 1];
      if (!next) return;

      btn.disabled = true;
      btn.textContent = 'Updating…';
      try {
        const res = await fetch('/api/vendor-orders?token=' + encodeURIComponent(token), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'update-status', orderId: btn.dataset.advance, newStatus: next })
        });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.error || 'Update failed');
        toast('Order moved to ' + STATUS_LABELS[next]);
        loadOrders();
      } catch (err) {
        toast('Could not update: ' + err.message);
        btn.disabled = false;
        btn.textContent = NEXT_LABEL[btn.dataset.status] || 'Advance';
      }
    });

    document.getElementById('chips').addEventListener('click', e => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      statusFilter = chip.dataset.status;
      renderOrders();
    });

    /* ---------- Products ---------- */
    async function loadProducts() {
      try {
        const res = await fetch('/api/products?vendorId=' + encodeURIComponent(vendor.id));
        allProducts = await res.json();
        if (!Array.isArray(allProducts)) allProducts = [];
        renderProducts();
        renderStats();
      } catch (e) {
        document.getElementById('productsList').innerHTML = '<div class="state">Could not load products.</div>';
      }
    }

    function renderProducts() {
      const el = document.getElementById('productsList');
      if (!allProducts.length) {
        el.innerHTML = '<div class="state">No products yet — add your first item to go live!</div>';
        return;
      }
      el.innerHTML = allProducts.map(p => `
        <div class="product-row">
          <div class="p-thumb">${p.image_url ? `<img src="${esc(p.image_url)}" alt="">` : '🍽️'}</div>
          <div class="p-info">
            <div class="p-name">${esc(p.name)}</div>
            <div class="p-meta">${esc(p.category || '')} · ${
              p.stock <= 0
                ? '<span style="color:var(--red);font-weight:700">Out of stock</span>'
                : p.stock <= 5
                  ? '<span style="color:var(--amber);font-weight:700">' + p.stock + ' left</span>'
                  : p.stock + ' in stock'
            }</div>
          </div>
          <div class="p-price">${inr(p.price)}</div>
          <button class="icon-btn" data-edit="${p.id}">Edit</button>
          <button class="icon-btn danger" data-delete="${p.id}">Delete</button>
        </div>
      `).join('');
    }

    const formEl = document.getElementById('productForm');
    const toggleFormBtn = document.getElementById('toggleFormBtn');

    function openForm(product) {
      document.getElementById('formTitle').textContent = product ? 'Edit product' : 'Add a new product';
      document.getElementById('pId').value = product ? product.id : '';
      document.getElementById('pName').value = product ? product.name : '';
      document.getElementById('pCategory').value = product ? (product.category || '') : '';
      document.getElementById('pPrice').value = product ? product.price : '';
      document.getElementById('pStock').value = product ? (product.stock ?? 0) : 0;
      document.getElementById('pImage').value = product ? (product.image_url || '') : '';
      document.getElementById('pDesc').value = product ? (product.description || '') : '';
      formEl.classList.add('open');
      document.getElementById('pName').focus();
    }
    function closeForm() {
      formEl.classList.remove('open');
      document.getElementById('pForm').reset();
      document.getElementById('pId').value = '';
    }

    toggleFormBtn.addEventListener('click', () => formEl.classList.contains('open') ? closeForm() : openForm(null));
    document.getElementById('cancelBtn').addEventListener('click', closeForm);

    document.getElementById('pForm').addEventListener('submit', async e => {
      e.preventDefault();
      const saveBtn = document.getElementById('saveBtn');
      const product = {
        id: document.getElementById('pId').value || undefined,
        name: document.getElementById('pName').value.trim(),
        category: document.getElementById('pCategory').value.trim(),
        description: document.getElementById('pDesc').value.trim(),
        price: parseFloat(document.getElementById('pPrice').value),
        stock: parseInt(document.getElementById('pStock').value, 10) || 0,
        image_url: document.getElementById('pImage').value.trim()
      };

      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving…';
      try {
        const res = await fetch('/api/products', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, product })
        });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.error || 'Save failed');
        toast(product.id ? 'Product updated' : 'Product added');
        closeForm();
        loadProducts();
      } catch (err) {
        toast('Could not save: ' + err.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save Product';
      }
    });

    document.getElementById('productsList').addEventListener('click', async e => {
      const editBtn = e.target.closest('[data-edit]');
      const delBtn = e.target.closest('[data-delete]');

      if (editBtn) {
        const p = allProducts.find(x => String(x.id) === String(editBtn.dataset.edit));
        if (p) openForm(p);
        return;
      }
      if (delBtn) {
        if (!confirm('Remove this product from your menu?')) return;
        try {
          const res = await fetch('/api/products', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, productId: delBtn.dataset.delete })
          });
          const data = await res.json();
          if (!res.ok || !data.success) throw new Error(data.error || 'Delete failed');
          toast('Product removed');
          loadProducts();
        } catch (err) {
          toast('Could not delete: ' + err.message);
        }
      }
    });

    /* ---------- Accounting ---------- */
    let accDays = '0';

    document.getElementById('accChips').addEventListener('click', e => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      document.querySelectorAll('#accChips .chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      accDays = chip.dataset.days;
      loadAccounting();
    });

    async function loadAccounting() {
      const body = document.getElementById('accBody');
      body.innerHTML = '<div class="state">Loading accounts…</div>';
      try {
        const res = await fetch('/api/vendor-orders?accounting=1&days=' + accDays + '&token=' + encodeURIComponent(token));
        if (res.status === 401) return authFail();
        const { summary, ledger } = await res.json();
        const d = summary.delivered, ip = summary.in_progress, cx = summary.cancelled;

        const card = (label, value, color) =>
          `<div class="stat"><div class="label">${label}</div><div class="value" style="font-size:21px;${color ? 'color:' + color : ''}">${value}</div></div>`;

        body.innerHTML = `
          <div class="stats" style="margin-bottom:14px">
            ${card('Gross Sales (items)', inr(d.gross))}
            ${card('Delivery Fees', inr(d.delivery_fees))}
            ${card('Commission (−)', '− ' + inr(d.commission), 'var(--red)')}
            ${card('Net Earnings', inr(d.net), 'var(--green)')}
          </div>
          <div class="stats" style="grid-template-columns:repeat(4,1fr);margin-bottom:18px">
            ${card('Delivered Orders', d.orders)}
            ${card('💵 COD Collected', inr(d.cod_cash))}
            ${card('📲 UPI Online', inr(d.upi_online))}
            ${card('In Progress', ip.orders + ' (' + inr(ip.value) + ')', 'var(--amber)')}
          </div>
          <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
              <h3 style="font-size:15px;font-weight:700;color:var(--dark)">Delivered order ledger</h3>
              <span style="font-size:12px;color:var(--muted)">${cx.orders} cancelled in period</span>
            </div>
            <div style="overflow-x:auto">
              <table style="width:100%;border-collapse:collapse;font-size:13px">
                <thead><tr>
                  ${['Date', 'Order', 'Items', 'Delivery', 'Commission', 'Net', 'Paid via'].map(h =>
                    `<th style="text-align:left;padding:9px 10px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;border-bottom:2px solid var(--border);white-space:nowrap">${h}</th>`).join('')}
                </tr></thead>
                <tbody>
                  ${ledger.length ? ledger.map(o => `
                    <tr>
                      <td style="padding:9px 10px;border-bottom:1px solid #f1f5f9;white-space:nowrap">${new Date(o.created_at).toLocaleDateString('en-IN', { day: '2-digit', month: '2-digit', year: 'numeric' })}</td>
                      <td style="padding:9px 10px;border-bottom:1px solid #f1f5f9"><b style="color:var(--dark)">${esc(o.order_id)}</b></td>
                      <td style="padding:9px 10px;border-bottom:1px solid #f1f5f9">${inr(o.subtotal)}</td>
                      <td style="padding:9px 10px;border-bottom:1px solid #f1f5f9">${inr(o.delivery_fee)}</td>
                      <td style="padding:9px 10px;border-bottom:1px solid #f1f5f9;color:var(--red)">− ${inr(o.commission_amount)}</td>
                      <td style="padding:9px 10px;border-bottom:1px solid #f1f5f9;font-weight:700;color:var(--green)">${inr(Number(o.subtotal) + Number(o.delivery_fee) - Number(o.commission_amount))}</td>
                      <td style="padding:9px 10px;border-bottom:1px solid #f1f5f9">${esc(o.payment_method)} · ${esc(o.payment_status)}</td>
                    </tr>`).join('')
                  : '<tr><td colspan="7" style="padding:24px;text-align:center;color:var(--muted)">No delivered orders in this period.</td></tr>'}
                </tbody>
              </table>
            </div>
            <div style="font-size:11px;color:var(--muted);margin-top:10px">Net = items + delivery fee − marketplace commission. Revenue counts on delivery; cancelled orders are excluded.</div>
          </div>`;
      } catch (e) {
        body.innerHTML = '<div class="state">Could not load accounts. Refresh to retry.</div>';
      }
    }

    /* ---------- Shop settings ---------- */
    document.getElementById('sDays').innerHTML = 'Sun Mon Tue Wed Thu Fri Sat'.split(' ').map((d, i) =>
      `<label style="display:flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:8px;padding:7px 11px;font-size:13px;text-transform:none;letter-spacing:0;cursor:pointer;margin:0">
        <input type="checkbox" value="${i}" checked> ${d}
      </label>`).join('');

    let settingsLoaded = false;
    async function loadSettings() {
      try {
        const res = await fetch('/api/vendor-settings?token=' + encodeURIComponent(token));
        if (res.status === 401) return authFail();
        const s = await res.json();
        document.getElementById('sOpen').checked = s.is_open !== false;
        document.getElementById('sOpenTime').value = s.open_time ? s.open_time.slice(0, 5) : '';
        document.getElementById('sCloseTime').value = s.close_time ? s.close_time.slice(0, 5) : '';
        const days = String(s.open_days || '0,1,2,3,4,5,6').split(',');
        document.querySelectorAll('#sDays input').forEach(cb => cb.checked = days.includes(cb.value));
        document.getElementById('sDeliveryFee').value = s.delivery_fee ?? 30;
        document.getElementById('sMinOrder').value = s.min_order ?? 0;
        document.getElementById('sCod').checked = s.accepts_cod !== false;
        document.getElementById('sUpi').value = s.upi_id || '';
        document.getElementById('sPhone').value = s.phone || '';
        document.getElementById('sAddress').value = s.address || '';
        document.getElementById('sDesc').value = s.description || '';
        settingsLoaded = true;
      } catch (e) {
        toast('Could not load settings');
      }
    }

    document.getElementById('settingsForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('sSaveBtn');
      const days = [...document.querySelectorAll('#sDays input:checked')].map(cb => cb.value);
      btn.disabled = true;
      btn.textContent = 'Saving…';
      try {
        const res = await fetch('/api/vendor-settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token,
            fields: {
              is_open: document.getElementById('sOpen').checked,
              open_time: document.getElementById('sOpenTime').value,
              close_time: document.getElementById('sCloseTime').value,
              open_days: days.join(','),
              delivery_fee: document.getElementById('sDeliveryFee').value,
              min_order: document.getElementById('sMinOrder').value,
              accepts_cod: document.getElementById('sCod').checked,
              upi_id: document.getElementById('sUpi').value,
              phone: document.getElementById('sPhone').value,
              address: document.getElementById('sAddress').value,
              description: document.getElementById('sDesc').value
            }
          })
        });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.error || 'Save failed');
        toast('Settings saved — live immediately');
      } catch (err) {
        toast(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Save Settings';
      }
    });

    /* ---------- Stats & tabs ---------- */
    function renderStats() {
      document.getElementById('statOrders').textContent = allOrders.length;
      document.getElementById('statRevenue').textContent = inr(allOrders.reduce((s, o) => s + Number(o.total || 0), 0));
      document.getElementById('statPending').textContent = allOrders.filter(o => o.status === 'pending').length;
      document.getElementById('statProducts').textContent = allProducts.length;
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
        if (tab.dataset.tab === 'settings' && !settingsLoaded) loadSettings();
        if (tab.dataset.tab === 'accounting') loadAccounting();
      });
    });

    // Auto-refresh orders every 30s so new orders appear without manual reload
    loadOrders();
    loadProducts();
    setInterval(loadOrders, 30000);
  </script>
</body>
</html>
