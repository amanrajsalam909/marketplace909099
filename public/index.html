<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RajkotMarket — Shop Local, Delivered Fast</title>
  <meta name="description" content="Rajkot's local marketplace. Food, electronics, fashion, grocery and more — delivered to your door.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #e85d04;
      --primary-dark: #c44e03;
      --primary-light: #fff1e6;
      --dark: #1e293b;
      --text: #334155;
      --muted: #64748b;
      --border: #e2e8f0;
      --bg: #f8fafc;
      --card: #ffffff;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 8px 24px rgba(15, 23, 42, 0.12);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand {
      font-size: 20px;
      font-weight: 800;
      color: var(--dark);
      text-decoration: none;
      white-space: nowrap;
      letter-spacing: -0.5px;
    }
    .brand span { color: var(--primary); }
    .search-box {
      flex: 1;
      max-width: 480px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 14px;
      font-family: inherit;
      background: var(--bg);
    }
    .search-box input:focus {
      outline: none;
      border-color: var(--primary);
      background: var(--card);
    }
    .search-box::before {
      content: '🔍';
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      opacity: 0.5;
    }
    .header-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-ghost { background: transparent; color: var(--muted); }
    .btn-ghost:hover { color: var(--dark); background: var(--bg); }
    .cart-count {
      background: var(--dark);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      min-width: 18px;
      height: 18px;
      border-radius: 999px;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
    }

    /* Layout */
    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 20px 60px;
      flex: 1 0 auto;
    }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .sort-bar {
      display: flex;
      justify-content: flex-end;
      margin: 2px 2px 16px;
    }
    .sort-dd { position: relative; }
    .sort-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--dark);
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
    }
    .sort-btn:hover { border-color: var(--primary); }
    .sort-btn strong { color: var(--primary); font-weight: 700; }
    .sort-ico { font-size: 15px; }
    .sort-caret { font-size: 11px; color: var(--muted); transition: transform .15s; }
    .sort-dd.open .sort-btn { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
    .sort-dd.open .sort-caret { transform: rotate(180deg); }
    .sort-menu {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      min-width: 184px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(15,23,42,.14);
      padding: 6px;
      z-index: 30;
    }
    .sort-dd.open .sort-menu { display: block; }
    .sort-opt {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border: none;
      background: transparent;
      color: var(--dark);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
    }
    .sort-opt:hover { background: var(--bg); }
    .sort-opt.active { color: var(--primary); font-weight: 700; }
    .sort-check { color: var(--primary); font-weight: 800; }
    .section-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--dark);
      letter-spacing: -0.3px;
    }
    .back-btn {
      display: none;
      align-items: center;
      gap: 6px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
    }
    .back-btn:hover { border-color: var(--primary); color: var(--primary); }

    /* Vendor cards */
    .vendors-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }
    .vendor-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .vendor-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }
    .vendor-banner {
      height: 96px;
      display: flex;
      align-items: flex-end;
      padding: 12px;
      position: relative;
      overflow: hidden;
    }
    /* Show the WHOLE logo at full width — banner grows to the image height,
       so nothing is cropped and the image isn't shrunk into a letterbox. */
    .vendor-banner-img {
      display: block;
      width: 100%;
      height: auto;
    }
    .vendor-card.has-logo .vendor-banner {
      height: auto;
      padding: 0;
      display: block;
    }
    /* The logo replaces the badge + gradient; drop the duplicate avatar. */
    .vendor-card.has-logo .vendor-avatar { display: none; }
    .vendor-card.has-logo .vendor-body { padding-top: 16px; }
    .vendor-avatar {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: var(--card);
      border: 3px solid var(--card);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: -34px;
    }
    .vendor-body { padding: 42px 16px 16px; }
    .vendor-name { font-size: 16px; font-weight: 700; color: var(--dark); }
    .vendor-meta { font-size: 13px; color: var(--muted); margin-top: 3px; }
    .vendor-desc {
      font-size: 13px;
      color: var(--muted);
      margin-top: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .offer-tag {
      display: inline-block;
      margin-top: 8px;
      background: #ecfdf5;
      color: #047857;
      border: 1px dashed #6ee7b7;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
    }

    /* Shop-page offers strip */
    .offers-strip {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: var(--radius);
      padding: 12px 16px;
      margin: -6px 0 18px;
    }
    .offer-pill { font-size: 13px; color: #065f46; padding: 3px 0; }
    .offers-note { font-size: 11px; color: #047857; margin-top: 6px; }

    /* Shop policies strip */
    .policy-box {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 4px 16px; margin: -6px 0 18px;
    }
    .policy-row { display: flex; gap: 12px; padding: 10px 0; font-size: 13px; }
    .policy-row + .policy-row { border-top: 1px solid #f1f5f9; }
    .policy-label { font-weight: 700; color: var(--dark); white-space: nowrap; min-width: 132px; }
    .policy-text { color: var(--muted); white-space: pre-wrap; }
    @media (max-width: 560px) {
      .policy-row { flex-direction: column; gap: 3px; }
      .policy-label { min-width: 0; }
    }

    /* Product cards */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }
    .product-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .product-card { transition: box-shadow .15s, transform .15s; }
    .product-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
    .product-image {
      aspect-ratio: 1 / 1;          /* responsive square — scales at every resolution */
      background: linear-gradient(135deg, var(--primary-light), #ffe4cc);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      overflow: hidden;
      position: relative;
    }
    /* contain = whole image always visible (no cropping); white sits behind any bars */
    .product-image img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
    .product-body { padding: 14px; flex: 1; display: flex; flex-direction: column; }
    .product-category {
      font-size: 11px;
      font-weight: 600;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .product-name {
      font-size: 14px; font-weight: 600; color: var(--dark); margin-top: 4px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; min-height: 38px; line-height: 1.35;
    }
    .product-desc {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .product-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
    }
    .product-price { font-size: 16px; font-weight: 800; color: var(--dark); }
    .add-btn {
      background: #fff;
      color: var(--primary);
      border: 1px solid var(--primary);
      border-radius: 8px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, color 0.15s;
    }
    .add-btn:hover { background: var(--primary); color: #fff; }

    /* Discount badge over the image */
    .pc-off {
      position: absolute; top: 8px; left: 8px; z-index: 2;
      background: #dd1f26; color: #fff; font-size: 11px; font-weight: 800;
      letter-spacing: .3px; padding: 3px 7px; border-radius: 6px;
    }
    .pc-off.pc-off-green { background: #16a34a; }
    /* Delivery-time pill */
    .pc-eta {
      display: inline-flex; align-items: center; gap: 3px; align-self: flex-start;
      background: #eef2f7; color: #3d8b00; font-size: 11px; font-weight: 800;
      padding: 3px 8px; border-radius: 6px; margin-bottom: 6px;
    }
    .pc-specs { font-size: 11px; color: var(--primary); font-weight: 600; margin-top: 3px; }
    .pc-bottom {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-top: auto; padding-top: 12px;
    }
    .pc-price-wrap { display: flex; flex-direction: column; line-height: 1.15; }
    .pc-mrp { font-size: 12px; color: var(--muted); text-decoration: line-through; }
    .pc-out { font-size: 12px; font-weight: 700; color: #dc2626; }
    /* Quantity stepper (replaces Add once in cart) */
    .pc-step {
      display: inline-flex; align-items: center; overflow: hidden;
      border: 1px solid var(--primary); border-radius: 8px;
    }
    .pc-step button {
      background: var(--primary); color: #fff; border: none;
      width: 30px; height: 32px; font-size: 18px; font-weight: 700;
      line-height: 1; cursor: pointer; font-family: inherit;
    }
    .pc-step span { min-width: 30px; text-align: center; font-weight: 800; color: var(--primary); font-size: 14px; }

    /* States */
    .state {
      text-align: center;
      padding: 56px 20px;
      color: var(--muted);
      font-size: 14px;
    }
    .skeleton-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }
    .skeleton {
      height: 190px;
      border-radius: var(--radius);
      background: linear-gradient(90deg, #eef2f7 25%, #f8fafc 50%, #eef2f7 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--dark);
      color: #fff;
      padding: 12px 22px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      transition: transform 0.25s ease;
      z-index: 200;
      max-width: calc(100vw - 40px);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* Footer */
    .footer {
      border-top: 1px solid var(--border);
      background: var(--card);
      padding: 22px 20px;
      flex-shrink: 0;
    }
    .footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      color: var(--muted);
    }
    .footer a { color: var(--muted); text-decoration: none; margin-left: 18px; }
    .footer a:hover { color: var(--primary); }

    @media (max-width: 640px) {
      .header-inner { flex-wrap: wrap; padding: 12px 16px; }
      .search-box { order: 3; max-width: none; flex-basis: 100%; }
      .hero { padding: 36px 16px 42px; }
      .container { padding: 24px 16px 48px; }
      .products-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .btn { padding: 8px 12px; font-size: 13px; }
    }

    /* Hamburger button (three lines) */
    .icon-btn {
      display: inline-flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px;
      width: 40px; height: 40px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--card);
      cursor: pointer; color: var(--dark); flex-shrink: 0;
    }
    .icon-btn:hover { border-color: var(--primary); color: var(--primary); }
    .icon-btn span { display: block; width: 18px; height: 2px; background: currentColor; border-radius: 2px; }

    /* Slide-in drawers + overlay */
    .drawer-overlay {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45);
      opacity: 0; visibility: hidden; transition: opacity 0.2s; z-index: 140;
    }
    .drawer-overlay.show { opacity: 1; visibility: visible; }
    .drawer {
      position: fixed; top: 0; bottom: 0; width: 320px; max-width: 85vw;
      background: var(--card); z-index: 150;
      display: flex; flex-direction: column;
      box-shadow: var(--shadow-lg); transition: transform 0.25s ease;
    }
    .drawer-left  { left: 0;  transform: translateX(-100%); }
    .drawer.show { transform: translateX(0); }
    .drawer-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 18px; border-bottom: 1px solid var(--border);
    }
    .drawer-title { font-size: 16px; font-weight: 800; color: var(--dark); }
    .drawer-close {
      background: none; border: none; font-size: 19px; line-height: 1;
      cursor: pointer; color: var(--muted);
    }
    .drawer-close:hover { color: var(--dark); }
    .drawer-body { flex: 1; overflow-y: auto; padding: 12px; }

    /* Category menu items */
    .cat-menu-item {
      display: flex; align-items: center; gap: 10px;
      width: 100%; padding: 12px 14px; border: none; background: none;
      border-radius: 10px; font-size: 14px; font-weight: 600;
      color: var(--text); cursor: pointer; font-family: inherit; text-align: left;
    }
    .cat-menu-item:hover { background: var(--bg); }
    .cat-menu-item.active { background: var(--dark); color: #fff; }
    .cat-menu-icon { font-size: 18px; width: 22px; text-align: center; }

    /* Smartphone: stop iOS Safari zooming in when a field is tapped (needs >=16px) */
    html { -webkit-text-size-adjust: 100%; }
    @media (max-width: 600px) {
      input, select, textarea { font-size: 16px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <button class="icon-btn" id="menuBtn" aria-label="Browse categories" title="Categories">
        <span></span><span></span><span></span>
      </button>
      <a class="brand" href="/">Rajkot<span>Market</span></a>
      <div class="search-box">
        <input type="search" id="searchInput" placeholder="Search shops or products…" autocomplete="off">
      </div>
      <div class="header-actions">
        <button class="btn btn-ghost" id="accountBtn">Sign In</button>
        <a class="btn btn-primary" href="cart.html">🛒 Cart <span class="cart-count" id="cartCount"></span></a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="section-head" style="display:none">
      <h2 class="section-title" id="sectionTitle"></h2>
      <button class="back-btn" id="backBtn">← All Shops</button>
    </div>
    <div id="content">
      <div class="skeleton-grid">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div>© 2026 RajkotMarket — supporting local businesses in Rajkot.</div>
    </div>
  </footer>

  <div class="toast" id="toast"></div>

  <!-- Slide-in drawers -->
  <div class="drawer-overlay" id="drawerOverlay"></div>

  <aside class="drawer drawer-left" id="catDrawer" aria-label="Categories">
    <div class="drawer-head">
      <span class="drawer-title">🛍️ Categories</span>
      <button class="drawer-close" data-close-drawer aria-label="Close">✕</button>
    </div>
    <div class="drawer-body" id="catMenuList"></div>
  </aside>

  <!-- Sign-in modal -->
  <div id="modalBg" style="position:fixed;inset:0;background:rgba(15,23,42,0.5);display:none;align-items:center;justify-content:center;z-index:150;padding:20px">
    <div style="background:#fff;border-radius:14px;padding:24px;width:100%;max-width:400px;max-height:85vh;overflow-y:auto">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h3 id="modalTitle" style="font-size:17px;font-weight:800;color:var(--dark)">Sign In</h3>
        <button onclick="closeModal()" style="background:none;border:none;font-size:18px;cursor:pointer;color:#94a3b8">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="/colors.js"></script>
  <script>
    const state = {
      vendors: [],
      categories: [],
      offers: [],
      categoryFilter: '',
      products: [],
      allProducts: [],
      allProductsLoaded: false,
      ratings: {},            // { [productId]: { avg, count } } — per-product star ratings
      shopRatings: {},        // { [vendorId]: { avg, count } } — per-shop star ratings
      sortBy: 'relevance',    // shop-list sort: relevance | rating | delivery
      sortOpen: false,        // is the Sort dropdown open
      currentVendor: null,
      cart: JSON.parse(localStorage.getItem('cart') || '[]'),
      search: ''
    };

    const content = document.getElementById('content');
    const sectionTitle = document.getElementById('sectionTitle');
    const backBtn = document.getElementById('backBtn');
    const searchInput = document.getElementById('searchInput');

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const inr = n => '₹' + Number(n).toLocaleString('en-IN');
    // Per-product star-rating badge (shows nothing until a product has reviews).
    function ratingBadge(productId) {
      const r = state.ratings[productId];
      if (!r || !r.count) return '';
      return `<div class="product-rating" style="font-size:12px;color:#f59e0b;font-weight:700;margin-top:2px">★ ${r.avg} <span style="color:var(--muted);font-weight:500">(${r.count})</span></div>`;
    }
    // Fetch per-product ratings (optionally for one shop) and merge into state.
    async function loadRatings(vendorId) {
      try {
        const res = await fetch('/api/feedback?productRatings=1' + (vendorId ? '&vendorId=' + encodeURIComponent(vendorId) : ''));
        if (res.ok) Object.assign(state.ratings, await res.json());
      } catch (_) { /* ratings are non-critical */ }
    }
    // Fetch per-shop ratings once, for the home-list rating badge + sort.
    async function loadShopRatings() {
      try {
        const res = await fetch('/api/feedback?shopRatings=1');
        if (res.ok) state.shopRatings = await res.json();
      } catch (_) { /* ratings are non-critical */ }
    }
    // Human-friendly delivery ETA ("45 min" / "1 hr 15 min").
    function etaLabel(mins) {
      const m = Number(mins);
      if (!Number.isFinite(m) || m <= 0) return '';
      if (m < 60) return m + ' min';
      const h = Math.floor(m / 60), r = m % 60;
      return r ? `${h} hr ${r} min` : `${h} hr`;
    }
    // Shop-card star badge (nothing until the shop has product reviews).
    function shopRatingBadge(vendorId) {
      const r = state.shopRatings[vendorId];
      if (!r || !r.count) return '';
      return `<span style="color:#f59e0b;font-weight:700">★ ${r.avg}</span> <span style="color:var(--muted)">(${r.count})</span>`;
    }

    const BANNERS = [
      'linear-gradient(120deg,#fb923c,#ea580c)',
      'linear-gradient(120deg,#34d399,#059669)',
      'linear-gradient(120deg,#818cf8,#4f46e5)',
      'linear-gradient(120deg,#f472b6,#db2777)',
      'linear-gradient(120deg,#38bdf8,#0284c7)'
    ];
    const bannerFor = name => BANNERS[[...name].reduce((a, c) => a + c.charCodeAt(0), 0) % BANNERS.length];

    // Live offers for a shop (vendor-specific + marketplace-wide)
    const offersFor = vid => state.offers.filter(o => !o.vendor_id || o.vendor_id === vid);
    const offerTag = o => o.discount_type === 'percent'
      ? Number(o.discount_value) + '% OFF' + (o.max_discount ? ' up to ' + inr(o.max_discount) : '')
      : inr(o.discount_value) + ' OFF';

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 2200);
    }

    function updateCartCount() {
      const el = document.getElementById('cartCount');
      const count = state.cart.reduce((sum, i) => sum + i.quantity, 0);
      el.textContent = count;
      el.style.display = count > 0 ? 'inline-flex' : 'none';
    }

    async function loadMarketplace() {
      try {
        const [vRes, cRes, oRes] = await Promise.all([
          fetch('/api/marketplace?action=vendors'),
          fetch('/api/marketplace?action=categories'),
          fetch('/api/marketplace?action=offers')
        ]);
        state.vendors = await vRes.json();
        state.categories = cRes.ok ? await cRes.json() : [];
        state.offers = oRes.ok ? await oRes.json() : [];
        renderCategoryMenu();
        renderVendors();
        // Ratings arrive a beat later; re-render the list once they're in.
        loadShopRatings().then(() => { if (!state.currentVendor) renderVendors(); });
      } catch (e) {
        content.innerHTML = '<div class="state">Could not load shops. Please refresh the page.</div>';
      }
    }

    // Lazily fetch every shop's products once, so the home search can match products too.
    async function ensureAllProducts() {
      if (state.allProductsLoaded) return;
      try {
        const res = await fetch('/api/marketplace?action=products');
        state.allProducts = res.ok ? await res.json() : [];
        await loadRatings();   // all products' ratings, for the cross-shop search grid
      } catch (e) {
        state.allProducts = [];
      }
      state.allProductsLoaded = true;
    }

    function renderCategoryMenu() {
      const wrap = document.getElementById('catMenuList');
      // Only categories that actually have a live (available) shop in them
      const filled = state.categories.filter(c => state.vendors.some(v => v.category_id === c.id));
      const item = (cat, icon, name) =>
        `<button class="cat-menu-item ${state.categoryFilter === cat ? 'active' : ''}" data-cat="${esc(cat)}">
           <span class="cat-menu-icon">${icon}</span> ${esc(name)}
         </button>`;
      wrap.innerHTML = item('', '✨', 'All Shops')
        + (filled.length
            ? filled.map(c => item(c.id, esc(c.icon || '🛍️'), c.name)).join('')
            : '<div class="state" style="padding:24px 14px">No shops live yet — check back soon!</div>');
    }

    // Shop-list Sort dropdown (delegated — content is re-rendered).
    content.addEventListener('click', e => {
      // Toggle the menu open/closed.
      if (e.target.closest('#sortBtn')) {
        state.sortOpen = !state.sortOpen;
        renderVendors();
        return;
      }
      // Pick an option.
      const opt = e.target.closest('.sort-opt[data-sort]');
      if (opt) {
        state.sortBy = opt.dataset.sort;
        state.sortOpen = false;
        renderVendors();
      }
    });
    // Close the Sort menu when clicking anywhere outside it.
    document.addEventListener('click', e => {
      if (state.sortOpen && !e.target.closest('.sort-dd')) {
        state.sortOpen = false;
        renderVendors();
      }
    });

    document.getElementById('catMenuList').addEventListener('click', e => {
      const choice = e.target.closest('[data-cat]');
      if (!choice) return;
      state.categoryFilter = choice.dataset.cat;
      state.currentVendor = null;
      state.search = '';
      searchInput.value = '';
      renderCategoryMenu();
      renderVendors();
      closeDrawers();
    });

    function renderVendors() {
      const q = state.search.toLowerCase();
      const list = state.vendors.filter(v =>
        (!state.categoryFilter || v.category_id === state.categoryFilter) &&
        (!q || v.name.toLowerCase().includes(q) || (v.description || '').toLowerCase().includes(q))
      );

      // Match products across all shops too (only while searching). Respect the category filter.
      const vendorById = {};
      state.vendors
        .filter(v => !state.categoryFilter || v.category_id === state.categoryFilter)
        .forEach(v => { vendorById[v.id] = v; });
      const productMatches = q
        ? state.allProducts.filter(p => vendorById[p.vendor_id] && (
            p.name.toLowerCase().includes(q) ||
            (p.category || '').toLowerCase().includes(q) ||
            (p.product_no || '').toLowerCase().includes(q)
          ))
        : [];

      const catName = state.categoryFilter
        ? (state.categories.find(c => c.id === state.categoryFilter) || {}).name
        : null;
      // No heading on the shop list — the title only appears inside a shop
      document.querySelector('.section-head').style.display = 'none';
      backBtn.style.display = 'none';

      if (!list.length && !productMatches.length) {
        content.innerHTML = '<div class="state">No shops or products found' + (q ? ' for "' + esc(q) + '"' : (catName ? ' in ' + esc(catName) + ' yet — check back soon!' : ' yet — check back soon!')) + '</div>';
        return;
      }

      const head = txt => `<div style="font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:8px 2px 12px">${txt}</div>`;

      // ---- Sort the shop list ----
      const rate = id => state.shopRatings[id] || { avg: 0, count: 0 };
      const eta  = v  => Number.isFinite(Number(v.delivery_eta_mins)) ? Number(v.delivery_eta_mins) : 45;
      if (state.sortBy === 'rating') {
        list.sort((a, b) => rate(b.id).avg - rate(a.id).avg || rate(b.id).count - rate(a.id).count || a.name.localeCompare(b.name));
      } else if (state.sortBy === 'delivery') {
        list.sort((a, b) => eta(a) - eta(b) || a.name.localeCompare(b.name));
      }
      // 'relevance' keeps the API order (no sort).

      const SORTS = [['relevance', 'Relevance'], ['rating', 'Rating'], ['delivery', 'Delivery time']];
      const curLabel = (SORTS.find(([k]) => k === state.sortBy) || SORTS[0])[1];
      const sortBar = list.length
        ? `<div class="sort-bar">
             <div class="sort-dd ${state.sortOpen ? 'open' : ''}">
               <button class="sort-btn" id="sortBtn" aria-haspopup="true" aria-expanded="${state.sortOpen ? 'true' : 'false'}">
                 <span class="sort-ico">⇅</span> Sort: <strong>${esc(curLabel)}</strong> <span class="sort-caret">▾</span>
               </button>
               <div class="sort-menu" role="menu">
                 ${SORTS.map(([k, lbl]) =>
                   `<button class="sort-opt ${state.sortBy === k ? 'active' : ''}" data-sort="${k}" role="menuitem">
                      ${esc(lbl)}${state.sortBy === k ? ' <span class="sort-check">✓</span>' : ''}
                    </button>`).join('')}
               </div>
             </div>
           </div>`
        : '';

      const shopsHtml = list.length
        ? (q ? head('Shops') : '') + '<div class="vendors-grid">' + list.map(v => {
            const offer = offersFor(v.id)[0];
            const rb = shopRatingBadge(v.id);
            const et = etaLabel(eta(v));
            return `
        <div class="vendor-card${v.logo_url ? ' has-logo' : ''}" data-vendor="${v.id}">
          <div class="vendor-banner" style="background:${bannerFor(v.name)}">
            ${v.logo_url ? `<img class="vendor-banner-img" src="${esc(v.logo_url)}" alt="${esc(v.name)} logo" onerror="this.remove()">` : ''}
            <div class="vendor-avatar">${esc(v.name[0])}</div>
          </div>
          <div class="vendor-body">
            <div class="vendor-name">${esc(v.name)}</div>
            <div class="vendor-meta">${v.categories ? esc((v.categories.icon || '') + ' ' + v.categories.name) + ' · ' : ''}📍 ${esc(v.address || 'Rajkot')}${v.is_open === false ? ' · <span style="color:#dc2626;font-weight:700">Closed</span>' : ''}</div>
            <div class="vendor-meta" style="margin-top:3px">${rb ? rb + ' · ' : ''}🚚 ${esc(et)}</div>
            <div class="vendor-desc">${esc(v.description || 'Quality products from a local Rajkot business.')}</div>
            ${offer ? `<div class="offer-tag">🎉 ${esc(offerTag(offer))}</div>` : ''}
          </div>
        </div>`;
          }).join('') + '</div>'
        : '';

      const productsHtml = productMatches.length
        ? head('Products') + '<div class="products-grid">' + productMatches.map(p => {
            const v = vendorById[p.vendor_id];
            const out = typeof p.stock === 'number' && p.stock <= 0;
            return `
        <div class="product-card" data-vendor="${p.vendor_id}" style="cursor:pointer${out ? ';opacity:0.6' : ''}">
          <div class="product-image">${p.image_url ? `<img src="${esc(p.image_url)}" alt="${esc(p.name)}">` : '🛍️'}</div>
          <div class="product-body">
            <div class="product-category">${esc(p.category || 'General')}${p.product_no ? ' · #' + esc(p.product_no) : ''}</div>
            <div class="product-name">${esc(p.name)}</div>
            ${ratingBadge(p.id)}
            <div class="product-desc">🏬 ${esc(v.name)}${out ? ' · <span style="color:#dc2626;font-weight:600">Out of stock</span>' : ''}</div>
            <div class="product-footer">
              <div class="product-price">${inr(p.price)}</div>
              <span class="add-btn" style="background:transparent;color:var(--primary);border:1px solid var(--primary)">View in shop →</span>
            </div>
          </div>
        </div>`;
          }).join('') + '</div>'
        : '';

      content.innerHTML = sortBar + shopsHtml + productsHtml;
    }

    async function openVendor(vendorId) {
      state.currentVendor = state.vendors.find(v => v.id === vendorId) || null;
      if (!state.currentVendor) return;

      document.querySelector('.section-head').style.display = 'flex';
      sectionTitle.textContent = state.currentVendor.name;
      backBtn.style.display = 'inline-flex';
      content.innerHTML = '<div class="skeleton-grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>';
      window.scrollTo({ top: document.querySelector('.container').offsetTop - 70, behavior: 'smooth' });

      try {
        const [pRes, rRes] = await Promise.all([
          fetch('/api/marketplace?action=products&vendorId=' + encodeURIComponent(vendorId)),
          fetch('/api/feedback?reviews=1&vendorId=' + encodeURIComponent(vendorId)),
          loadRatings(vendorId)   // per-product ratings for this shop's items
        ]);
        state.products = await pRes.json();
        state.shopRating = rRes.ok ? await rRes.json() : { count: 0 };
        renderProducts();
      } catch (e) {
        content.innerHTML = '<div class="state">Could not load the menu. Please try again.</div>';
      }
    }

    function renderProducts() {
      const q = state.search.toLowerCase();
      const list = state.products.filter(p => !q || p.name.toLowerCase().includes(q) || (p.category || '').toLowerCase().includes(q));

      if (!list.length) {
        content.innerHTML = '<div class="state">No items found' + (q ? ' for "' + esc(q) + '"' : ' from this shop yet.') + '</div>';
        return;
      }

      const offs = state.currentVendor ? offersFor(state.currentVendor.id) : [];
      const offersHtml = offs.length ? `
        <div class="offers-strip">
          ${offs.map(o => `<div class="offer-pill">🎉 <b>${esc(offerTag(o))}</b>${Number(o.min_order) > 0 ? ' on orders above ' + inr(o.min_order) : ''}${o.description ? ' — ' + esc(o.description) : ''}</div>`).join('')}
          <div class="offers-note">Best offer auto-applies at checkout — no code needed.</div>
        </div>` : '';

      const r = state.shopRating || { count: 0 };
      const ratingHtml = r.count
        ? `<div style="margin:-8px 0 16px;font-size:13px;color:var(--muted)">
             <span style="color:#f59e0b;font-weight:700">★ ${r.avg}</span> · ${r.count} review${r.count > 1 ? 's' : ''}
             ${(r.reviews || []).slice(0, 2).map(rv => `<div style="margin-top:6px">"${esc(rv.comment || '')}" — ${esc(rv.customer_name)} (${'★'.repeat(rv.rating)})</div>`).join('')}
           </div>`
        : '';

      // Shop policies (return / cancellation / delivery) — set by admin, public-safe
      const pol = (state.currentVendor && state.currentVendor.policies) || {};
      const polItems = [
        ['↩️ Return &amp; Refund', pol.return],
        ['🚫 Cancellation', pol.cancellation],
        ['🚚 Delivery', pol.delivery]
      ].filter(([, v]) => v && String(v).trim());
      const policyHtml = polItems.length
        ? '<div class="policy-box">' + polItems.map(([label, text]) =>
            `<div class="policy-row"><span class="policy-label">${label}</span><span class="policy-text">${esc(text)}</span></div>`).join('') + '</div>'
        : '';

      const vEta = state.currentVendor && Number.isFinite(Number(state.currentVendor.delivery_eta_mins))
        ? Number(state.currentVendor.delivery_eta_mins) : 45;
      const et = state.currentVendor ? etaLabel(vEta) : '';
      const vendorOffers = state.currentVendor ? offersFor(state.currentVendor.id) : [];
      content.innerHTML = offersHtml + ratingHtml + policyHtml + '<div class="products-grid">' + list.map(p => {
        const out = typeof p.stock === 'number' && p.stock <= 0;
        const low = !out && typeof p.stock === 'number' && p.stock <= 5;
        const hasSpecs = Array.isArray(p.specs) && p.specs.length > 0;
        const hasPickable = hasSpecs && p.specs.some(s => !s.static);
        const mrp = Number(p.mrp) || 0;
        const disc = mrp > Number(p.price);
        const pct = disc ? Math.round((1 - p.price / mrp) * 100) : 0;
        const pOffer = vendorOffers.find(o => o.product_id && String(o.product_id) === String(p.id));
        const offerLabel = pOffer
          ? (pOffer.discount_type === 'percent' ? Math.round(pOffer.discount_value) + '% OFF' : inr(pOffer.discount_value) + ' OFF')
          : '';
        const qty = cartQty(p.id);
        return `
        <div class="product-card" data-prod="${p.id}" style="cursor:pointer;${out ? 'opacity:0.6' : ''}">
          <div class="product-image">
            ${pOffer
              ? `<span class="pc-off pc-off-green">🎉 ${esc(offerLabel)}</span>`
              : (disc ? `<span class="pc-off">${pct}% OFF</span>` : '')}
            ${p.image_url ? `<img src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy">` : '🛍️'}
          </div>
          <div class="product-body">
            ${et ? `<span class="pc-eta">⚡ ${esc(et)}</span>` : ''}
            <div class="product-category">${esc(p.category || 'General')}${p.product_no ? ' · #' + esc(p.product_no) : ''}</div>
            <div class="product-name">${esc(p.name)}</div>
            ${ratingBadge(p.id)}
            ${pOffer ? `<div class="pc-specs" style="color:#16a34a">🎉 ${esc(pOffer.name)}</div>` : ''}
            ${low ? `<div style="font-size:11px;color:#d97706;font-weight:700;margin-top:3px">Only ${p.stock} left!</div>` : ''}
            ${hasSpecs ? `<div class="pc-specs">${p.specs.map(s => esc(s.label)).join(' · ')} →</div>` : ''}
            <div class="pc-bottom">
              <div class="pc-price-wrap">
                <span class="product-price">${inr(p.price)}</span>
                ${disc ? `<span class="pc-mrp">${inr(mrp)}</span>` : ''}
              </div>
              ${out
                ? '<span class="pc-out">Out of stock</span>'
                : hasPickable
                  ? `<button class="add-btn" data-add="${p.id}" data-options="1">Choose</button>`
                  : qty > 0
                    ? `<div class="pc-step"><button data-dec="${p.id}" aria-label="Decrease">−</button><span>${qty}</span><button data-inc="${p.id}" aria-label="Increase">+</button></div>`
                    : `<button class="add-btn" data-add="${p.id}">Add</button>`}
            </div>
          </div>
        </div>`;
      }).join('') + '</div>';
    }

    // Quantity of a (spec-less) product already in the cart for the current shop.
    function cartQty(productId) {
      if (!state.currentVendor) return 0;
      return state.cart
        .filter(i => String(i.id) === String(productId) && i.vendor_id === state.currentVendor.id && !i.specs)
        .reduce((n, i) => n + i.quantity, 0);
    }

    // +/- on a product card. Adjusts the spec-less cart line and re-renders.
    function changeQty(productId, delta) {
      const line = state.cart.find(i => String(i.id) === String(productId) && state.currentVendor && i.vendor_id === state.currentVendor.id && !i.specs);
      if (!line) { if (delta > 0) addToCart(productId); return; }
      line.quantity += delta;
      if (line.quantity <= 0) state.cart = state.cart.filter(i => i !== line);
      localStorage.setItem('cart', JSON.stringify(state.cart));
      updateCartCount();
      renderProducts();
    }

    // Product detail popup — shows specs and lets the customer pick one value
    // per spec field before adding to cart. Reuses the shared modal.
    function openProductDetail(productId) {
      const p = state.products.find(x => String(x.id) === String(productId));
      if (!p) return;
      const out = typeof p.stock === 'number' && p.stock <= 0;
      const specs = Array.isArray(p.specs) ? p.specs : [];
      const variants = Array.isArray(p.product_variants) ? p.product_variants : [];
      const isVariant = variants.length > 0;

      const specsHtml = specs.map(s => {
        const isColor = RMColors.isColorField(s.label) || !!s.swatches;
        const hexOf = o => (s.swatches && s.swatches[o]) || RMColors.hexFor(o) || '#cbd5e1';
        // Info-only field: a read-only detail row showing the typed value.
        if (s.static) {
          const val = s.value || (s.options || []).join(', ');
          if (!val) return '';
          return `
        <div style="margin-bottom:10px;display:flex;gap:8px;font-size:13px">
          <span style="font-weight:700;color:var(--dark);min-width:96px">${esc(s.label)}</span>
          <span style="color:var(--muted)">${esc(val)}</span>
        </div>`;
        }
        return `
        <div style="margin-bottom:12px">
          <div style="font-size:12px;font-weight:700;color:var(--dark);margin-bottom:6px">${esc(s.label)}</div>
          <div class="pd-opts" data-key="${esc(s.key)}" data-label="${esc(s.label)}" style="display:flex;flex-wrap:wrap;gap:8px">
            ${(s.options || []).map((o, oi) => {
              // Variant products start unselected (customer must choose an in-stock combo);
              // simple pickable products keep the first option pre-selected.
              const sel = !isVariant && (s.options.length === 1 || oi === 0);
              return `<button type="button" class="pd-opt" data-opt="${esc(o)}" aria-pressed="${sel ? 'true' : 'false'}"
                style="cursor:pointer;font-size:13px;font-weight:600;padding:7px 14px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;border:1px solid ${sel ? 'var(--primary)' : 'var(--border)'};${sel ? 'background:var(--primary);color:#fff' : 'background:#fff;color:var(--dark)'}">${isColor ? `<span style="width:15px;height:15px;border-radius:50%;background:${esc(hexOf(o))};border:1px solid rgba(0,0,0,0.25)"></span>` : ''}${esc(o)}</button>`;
            }).join('')}
          </div>
        </div>`;
      }).join('');

      openModal(p.name, `
        <div style="max-height:70vh;overflow:auto">
          ${p.image_url ? `<img src="${esc(p.image_url)}" alt="${esc(p.name)}" style="width:100%;max-height:300px;object-fit:contain;background:#fff;border-radius:10px;margin-bottom:12px">` : ''}
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:var(--primary)">${esc(p.category || 'General')}${p.product_no ? ' · #' + esc(p.product_no) : ''}</div>
          <div style="font-size:20px;font-weight:800;color:var(--dark);margin:6px 0">${inr(p.price)}</div>
          ${p.description ? `<div style="font-size:13px;color:var(--muted);margin-bottom:14px">${esc(p.description)}</div>` : '<div style="margin-bottom:8px"></div>'}
          ${specsHtml}
          ${out
            ? '<div style="font-size:13px;font-weight:700;color:#dc2626;margin-top:8px">Out of stock</div>'
            : `<button id="pdAdd" data-prod-add="${p.id}" class="btn-primary" style="width:100%;margin-top:8px;padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer">Add to cart</button>`}
        </div>`);

      const modalBody = document.getElementById('modalBody');
      const groups = [...modalBody.querySelectorAll('.pd-opts')];

      const selectChip = (group, chip) => {
        group.querySelectorAll('.pd-opt').forEach(c => {
          c.setAttribute('aria-pressed', 'false');
          c.style.border = '1px solid var(--border)'; c.style.background = '#fff'; c.style.color = 'var(--dark)';
        });
        chip.setAttribute('aria-pressed', 'true');
        chip.style.border = '1px solid var(--primary)'; chip.style.background = 'var(--primary)'; chip.style.color = '#fff';
      };

      // ---- Variant cross-filtering: disable combos with no in-stock variant ----
      const matchKeys = (s, partial) => Object.keys(partial).every(k => s[k] === partial[k]);
      const someInStock = partial => variants.some(v => v.stock > 0 && matchKeys(v.specs || {}, partial));
      const stockOf = combo => {
        const ks = Object.keys(combo);
        const v = variants.find(v => ks.length === Object.keys(v.specs || {}).length && matchKeys(v.specs || {}, combo));
        return v ? v.stock : 0;
      };
      const currentSelection = () => {
        const sel = {};
        groups.forEach(g => { const c = g.querySelector('.pd-opt[aria-pressed="true"]'); if (c) sel[g.dataset.label] = c.dataset.opt; });
        return sel;
      };

      function refreshVariants() {
        // 1. Disable options that can't form an in-stock combo with the rest.
        groups.forEach(g => {
          const sel = currentSelection(); delete sel[g.dataset.label];
          g.querySelectorAll('.pd-opt').forEach(chip => {
            const ok = someInStock({ ...sel, [g.dataset.label]: chip.dataset.opt });
            chip.style.opacity = ok ? '' : '0.35';
            chip.style.pointerEvents = ok ? '' : 'none';
            chip.style.textDecoration = ok ? '' : 'line-through';
            chip.dataset.off = ok ? '' : '1';
          });
        });
        // 2. If a selected option got disabled, switch it to the first in-stock one.
        groups.forEach(g => {
          const cur = g.querySelector('.pd-opt[aria-pressed="true"]');
          if (cur && cur.dataset.off === '1') {
            const alt = [...g.querySelectorAll('.pd-opt')].find(c => c.dataset.off !== '1');
            if (alt) selectChip(g, alt);
          }
        });
        // 3. Update the Add button from the final selection.
        const btn = document.getElementById('pdAdd');
        if (!btn) return;
        const allChosen = groups.length && groups.every(g => g.querySelector('.pd-opt[aria-pressed="true"]'));
        if (!allChosen) { btn.disabled = true; btn.textContent = 'Select options'; return; }
        const st = stockOf(currentSelection());
        if (st <= 0) { btn.disabled = true; btn.textContent = 'Out of stock'; }
        else { btn.disabled = false; btn.textContent = st <= 5 ? `Add to cart — only ${st} left` : 'Add to cart'; }
      }

      groups.forEach(group => {
        group.addEventListener('click', e => {
          const chip = e.target.closest('.pd-opt');
          if (!chip || chip.dataset.off === '1') return;
          selectChip(group, chip);
          if (isVariant) refreshVariants();
        });
      });
      if (isVariant) refreshVariants();
    }

    function addToCart(productId, specs) {
      const p = state.products.find(x => String(x.id) === String(productId));
      if (!p || !state.currentVendor) return;

      // One vendor per order: if the cart already holds items from another shop,
      // ask before discarding them and starting a fresh cart with this shop.
      const otherVendor = state.cart.find(i => i.vendor_id !== state.currentVendor.id);
      if (otherVendor) {
        const ok = confirm(
          'Your cart has items from "' + (otherVendor.vendor_name || 'another shop') + '".\n\n' +
          'You can order from only one shop at a time. Start a new cart with "' +
          state.currentVendor.name + '"?'
        );
        if (!ok) return;
        state.cart = [];
      }

      const chosen = specs && Object.keys(specs).length ? specs : null;
      const sameSpecs = i => JSON.stringify(i.specs || null) === JSON.stringify(chosen);
      const existing = state.cart.find(i => String(i.id) === String(p.id) && i.vendor_id === state.currentVendor.id && sameSpecs(i));
      if (existing) existing.quantity++;
      else state.cart.push({
        id: p.id,
        name: p.name,
        price: Number(p.price),
        vendor_id: state.currentVendor.id,
        vendor_name: state.currentVendor.name,
        quantity: 1,
        specs: chosen
      });

      localStorage.setItem('cart', JSON.stringify(state.cart));
      updateCartCount();
      const tag = chosen ? ' (' + Object.values(chosen).join(' / ') + ')' : '';
      toast(p.name + tag + ' added to cart');
      // Refresh cards so a spec-less Add flips to the qty stepper.
      if (state.currentVendor && !chosen) renderProducts();
    }

    // Read the selected option per field from the open detail popup.
    function readDetailSpecs() {
      const groups = [...document.getElementById('modalBody').querySelectorAll('.pd-opts')];
      const out = {};
      for (const g of groups) {
        const sel = g.querySelector('.pd-opt[aria-pressed="true"]');
        if (!sel) return { error: g.dataset.label };
        out[g.dataset.label] = sel.dataset.opt;
      }
      return { specs: out };
    }

    content.addEventListener('click', e => {
      const inc = e.target.closest('[data-inc]');
      if (inc) return changeQty(inc.dataset.inc, 1);
      const dec = e.target.closest('[data-dec]');
      if (dec) return changeQty(dec.dataset.dec, -1);
      const addBtn = e.target.closest('[data-add]');
      if (addBtn) {
        if (addBtn.dataset.options) return openProductDetail(addBtn.dataset.add);
        return addToCart(addBtn.dataset.add);
      }
      const prodCard = e.target.closest('[data-prod]');
      if (prodCard) return openProductDetail(prodCard.dataset.prod);
      const card = e.target.closest('[data-vendor]');
      if (card) openVendor(card.dataset.vendor);
    });

    // Add-to-cart from inside the detail popup
    document.getElementById('modalBody').addEventListener('click', e => {
      const btn = e.target.closest('[data-prod-add]');
      if (!btn) return;
      const r = readDetailSpecs();
      if (r.error) return toast('Please choose a ' + r.error);
      addToCart(btn.dataset.prodAdd, r.specs);
      closeModal();
    });

    backBtn.addEventListener('click', () => {
      state.currentVendor = null;
      state.search = '';
      searchInput.value = '';
      renderVendors();
    });

    searchInput.addEventListener('input', async () => {
      state.search = searchInput.value.trim();
      if (state.currentVendor) return renderProducts();
      if (state.search) await ensureAllProducts();
      // Ignore a stale fetch if the user cleared/changed the box meanwhile.
      if (!state.currentVendor) renderVendors();
    });

    /* ---------- Customer account (email OTP) ---------- */
    const FIELD = 'width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:8px;font-size:16px;font-family:inherit;margin-bottom:10px;box-sizing:border-box';
    const PBTN = 'width:100%;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer';
    const ERRB = 'background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;padding:9px 12px;border-radius:8px;font-size:12px;margin-bottom:10px;display:none';

    let cust = JSON.parse(localStorage.getItem('custSession') || 'null');

    function refreshAccountBtn() {
      document.getElementById('accountBtn').textContent =
        cust ? '👤 ' + (cust.name || cust.phone) : 'Sign In';
    }

    function openModal(title, bodyHtml) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalBody').innerHTML = bodyHtml;
      document.getElementById('modalBg').style.display = 'flex';
    }
    function closeModal() { document.getElementById('modalBg').style.display = 'none'; }
    document.getElementById('modalBg').addEventListener('click', e => {
      if (e.target.id === 'modalBg') closeModal();
    });
    function mErr(msg) {
      const el = document.getElementById('mErr');
      if (el) { el.textContent = msg; el.style.display = 'block'; }
    }

    document.getElementById('accountBtn').addEventListener('click', () => {
      cust ? location.href = 'account.html' : showSignIn();
    });

    function showSignIn() {
      openModal('Sign In', `
        <div id="mErr" style="${ERRB}"></div>
        <input id="siPhone" type="tel" inputmode="numeric" placeholder="10-digit mobile number" style="${FIELD}">
        <input id="siEmail" type="email" placeholder="Email (we'll send your code here)" style="${FIELD}">
        <button id="siSend" style="${PBTN}">Send Code</button>
        <p style="font-size:11px;color:var(--muted);margin-top:10px;text-align:center">A 6-digit code will be emailed to you. No password needed.</p>`);
      document.getElementById('siSend').addEventListener('click', sendOtp);
    }

    async function sendOtp() {
      const phone = document.getElementById('siPhone').value.trim();
      const email = document.getElementById('siEmail').value.trim();
      const btn = document.getElementById('siSend');
      btn.disabled = true; btn.textContent = 'Sending…';
      try {
        const res = await fetch('/api/customer-auth', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'send-otp', phone, email })
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'Could not send the code.');
        showOtpStep(phone, email);
      } catch (e) {
        mErr(e.message);
        btn.disabled = false; btn.textContent = 'Send Code';
      }
    }

    function showOtpStep(phone, email) {
      openModal('Enter Code', `
        <div id="mErr" style="${ERRB}"></div>
        <p style="font-size:13px;color:var(--muted);margin-bottom:12px">We emailed a 6-digit code to <b>${esc(email)}</b> (check Spam too).</p>
        <input id="siOtp" type="text" inputmode="numeric" maxlength="6" placeholder="6-digit code" style="${FIELD};text-align:center;font-size:20px;letter-spacing:6px">
        <button id="siVerify" style="${PBTN}">Verify & Sign In</button>
        <p style="text-align:center;margin-top:12px"><a href="#" id="siBack" style="font-size:12px;color:var(--muted)">← Change details</a></p>`);
      document.getElementById('siVerify').addEventListener('click', () => verifyOtp(phone, email));
      document.getElementById('siOtp').focus();
      document.getElementById('siBack').addEventListener('click', e => { e.preventDefault(); showSignIn(); });
    }

    async function verifyOtp(phone, email) {
      const otp = document.getElementById('siOtp').value.trim();
      const btn = document.getElementById('siVerify');
      btn.disabled = true; btn.textContent = 'Verifying…';
      try {
        const res = await fetch('/api/customer-auth', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'verify-otp', phone, email, otp })
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'Verification failed.');
        cust = { token: data.token, phone: data.phone, email: data.email, name: data.name };
        localStorage.setItem('custSession', JSON.stringify(cust));
        refreshAccountBtn();
        closeModal();
        toast('Signed in!');
      } catch (e) {
        mErr(e.message);
        btn.disabled = false; btn.textContent = 'Verify & Sign In';
      }
    }

    /* ---------- Slide-in drawers: categories (☰) + my orders (📦) ---------- */
    const drawerOverlay = document.getElementById('drawerOverlay');

    function openDrawer(el) {
      drawerOverlay.classList.add('show');
      el.classList.add('show');
    }
    function closeDrawers() {
      drawerOverlay.classList.remove('show');
      document.querySelectorAll('.drawer').forEach(d => d.classList.remove('show'));
    }
    drawerOverlay.addEventListener('click', closeDrawers);
    document.querySelectorAll('[data-close-drawer]').forEach(b => b.addEventListener('click', closeDrawers));
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawers(); });

    document.getElementById('menuBtn').addEventListener('click', () => openDrawer(document.getElementById('catDrawer')));

    refreshAccountBtn();
    loadMarketplace();
    updateCartCount();
  </script>
</body>
</html>
