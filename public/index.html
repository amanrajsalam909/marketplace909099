<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RajkotMarket — Shop Local, Delivered Fast</title>
  <meta name="description" content="Rajkot's local marketplace. Food, electronics, fashion, grocery and more — delivered to your door.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #e85d04;
      --primary-dark: #c44e03;
      --primary-light: #fff1e6;
      --dark: #1e293b;
      --text: #334155;
      --muted: #64748b;
      --border: #e2e8f0;
      --bg: #f8fafc;
      --card: #ffffff;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 8px 24px rgba(15, 23, 42, 0.12);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand {
      font-size: 20px;
      font-weight: 800;
      color: var(--dark);
      text-decoration: none;
      white-space: nowrap;
      letter-spacing: -0.5px;
    }
    .brand span { color: var(--primary); }
    .search-box {
      flex: 1;
      max-width: 480px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 14px;
      font-family: inherit;
      background: var(--bg);
    }
    .search-box input:focus {
      outline: none;
      border-color: var(--primary);
      background: var(--card);
    }
    .search-box::before {
      content: '🔍';
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      opacity: 0.5;
    }
    .header-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-ghost { background: transparent; color: var(--muted); }
    .btn-ghost:hover { color: var(--dark); background: var(--bg); }
    .cart-count {
      background: var(--dark);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      min-width: 18px;
      height: 18px;
      border-radius: 999px;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
    }

    /* Layout */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .section-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--dark);
      letter-spacing: -0.3px;
    }
    .back-btn {
      display: none;
      align-items: center;
      gap: 6px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
    }
    .back-btn:hover { border-color: var(--primary); color: var(--primary); }

    /* Category chips */
    .cat-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 22px;
      scrollbar-width: none;
    }
    .cat-chips::-webkit-scrollbar { display: none; }
    .cat-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .cat-chip:hover { border-color: var(--primary); color: var(--primary); }
    .cat-chip.active {
      background: var(--dark);
      color: #fff;
      border-color: var(--dark);
    }

    /* Vendor cards */
    .vendors-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }
    .vendor-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .vendor-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }
    .vendor-banner {
      height: 96px;
      display: flex;
      align-items: flex-end;
      padding: 12px;
    }
    .vendor-avatar {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: var(--card);
      border: 3px solid var(--card);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: -34px;
    }
    .vendor-body { padding: 42px 16px 16px; }
    .vendor-name { font-size: 16px; font-weight: 700; color: var(--dark); }
    .vendor-meta { font-size: 13px; color: var(--muted); margin-top: 3px; }
    .vendor-desc {
      font-size: 13px;
      color: var(--muted);
      margin-top: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Product cards */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }
    .product-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .product-image {
      height: 130px;
      background: linear-gradient(135deg, var(--primary-light), #ffe4cc);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
    }
    .product-image img { width: 100%; height: 100%; object-fit: cover; }
    .product-body { padding: 14px; flex: 1; display: flex; flex-direction: column; }
    .product-category {
      font-size: 11px;
      font-weight: 600;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .product-name { font-size: 14px; font-weight: 600; color: var(--dark); margin-top: 4px; }
    .product-desc {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .product-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
    }
    .product-price { font-size: 16px; font-weight: 800; color: var(--dark); }
    .add-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }
    .add-btn:hover { background: var(--primary-dark); }

    /* States */
    .state {
      text-align: center;
      padding: 56px 20px;
      color: var(--muted);
      font-size: 14px;
    }
    .skeleton-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }
    .skeleton {
      height: 190px;
      border-radius: var(--radius);
      background: linear-gradient(90deg, #eef2f7 25%, #f8fafc 50%, #eef2f7 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--dark);
      color: #fff;
      padding: 12px 22px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      transition: transform 0.25s ease;
      z-index: 200;
      max-width: calc(100vw - 40px);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* Footer */
    .footer {
      border-top: 1px solid var(--border);
      background: var(--card);
      padding: 28px 20px;
    }
    .footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      color: var(--muted);
    }
    .footer a { color: var(--muted); text-decoration: none; margin-left: 18px; }
    .footer a:hover { color: var(--primary); }

    @media (max-width: 640px) {
      .header-inner { flex-wrap: wrap; padding: 12px 16px; }
      .search-box { order: 3; max-width: none; flex-basis: 100%; }
      .hero { padding: 36px 16px 42px; }
      .container { padding: 24px 16px 48px; }
      .products-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .btn { padding: 8px 12px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a class="brand" href="/">Rajkot<span>Market</span></a>
      <div class="search-box">
        <input type="search" id="searchInput" placeholder="Search shops or products…" autocomplete="off">
      </div>
      <div class="header-actions">
        <a class="btn btn-ghost" href="track.html">Track Order</a>
        <a class="btn btn-ghost" href="vendor-login.html">Sell with us</a>
        <a class="btn btn-primary" href="cart.html">🛒 Cart <span class="cart-count" id="cartCount"></span></a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="cat-chips" id="catChips"></div>
    <div class="section-head">
      <h2 class="section-title" id="sectionTitle">Shops in Rajkot</h2>
      <button class="back-btn" id="backBtn">← All Shops</button>
    </div>
    <div id="content">
      <div class="skeleton-grid">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div>© 2026 RajkotMarket — supporting local businesses in Rajkot.</div>
      <div>
        <a href="track.html">Track Order</a>
        <a href="vendor-login.html">Sell on RajkotMarket</a>
      </div>
    </div>
  </footer>

  <div class="toast" id="toast"></div>

  <script>
    const state = {
      vendors: [],
      categories: [],
      categoryFilter: '',
      products: [],
      currentVendor: null,
      cart: JSON.parse(localStorage.getItem('cart') || '[]'),
      search: ''
    };

    const content = document.getElementById('content');
    const sectionTitle = document.getElementById('sectionTitle');
    const backBtn = document.getElementById('backBtn');
    const searchInput = document.getElementById('searchInput');

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const inr = n => '₹' + Number(n).toLocaleString('en-IN');

    const BANNERS = [
      'linear-gradient(120deg,#fb923c,#ea580c)',
      'linear-gradient(120deg,#34d399,#059669)',
      'linear-gradient(120deg,#818cf8,#4f46e5)',
      'linear-gradient(120deg,#f472b6,#db2777)',
      'linear-gradient(120deg,#38bdf8,#0284c7)'
    ];
    const bannerFor = name => BANNERS[[...name].reduce((a, c) => a + c.charCodeAt(0), 0) % BANNERS.length];

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 2200);
    }

    function updateCartCount() {
      const el = document.getElementById('cartCount');
      const count = state.cart.reduce((sum, i) => sum + i.quantity, 0);
      el.textContent = count;
      el.style.display = count > 0 ? 'inline-flex' : 'none';
    }

    async function loadMarketplace() {
      try {
        const [vRes, cRes] = await Promise.all([
          fetch('/api/marketplace?action=vendors'),
          fetch('/api/marketplace?action=categories')
        ]);
        state.vendors = await vRes.json();
        state.categories = cRes.ok ? await cRes.json() : [];
        renderCategoryChips();
        renderVendors();
      } catch (e) {
        content.innerHTML = '<div class="state">Could not load shops. Please refresh the page.</div>';
      }
    }

    function renderCategoryChips() {
      const wrap = document.getElementById('catChips');
      if (!state.categories.length) { wrap.style.display = 'none'; return; }
      wrap.style.display = 'flex';
      wrap.innerHTML = `<button class="cat-chip ${!state.categoryFilter ? 'active' : ''}" data-cat="">✨ All</button>`
        + state.categories.map(c =>
          `<button class="cat-chip ${state.categoryFilter === c.id ? 'active' : ''}" data-cat="${c.id}">${esc(c.icon || '🛍️')} ${esc(c.name)}</button>`
        ).join('');
    }

    document.getElementById('catChips').addEventListener('click', e => {
      const chip = e.target.closest('[data-cat]');
      if (!chip) return;
      state.categoryFilter = chip.dataset.cat;
      state.currentVendor = null;
      renderCategoryChips();
      renderVendors();
    });

    function renderVendors() {
      const q = state.search.toLowerCase();
      const list = state.vendors.filter(v =>
        (!state.categoryFilter || v.category_id === state.categoryFilter) &&
        (!q || v.name.toLowerCase().includes(q) || (v.description || '').toLowerCase().includes(q))
      );

      const catName = state.categoryFilter
        ? (state.categories.find(c => c.id === state.categoryFilter) || {}).name
        : null;
      sectionTitle.textContent = catName || 'Shops in Rajkot';
      backBtn.style.display = 'none';
      document.getElementById('catChips').style.display = state.categories.length ? 'flex' : 'none';

      if (!list.length) {
        content.innerHTML = '<div class="state">No shops found' + (q ? ' for "' + esc(q) + '"' : (catName ? ' in ' + esc(catName) + ' yet — check back soon!' : ' yet — check back soon!')) + '</div>';
        return;
      }

      content.innerHTML = '<div class="vendors-grid">' + list.map(v => `
        <div class="vendor-card" data-vendor="${v.id}">
          <div class="vendor-banner" style="background:${bannerFor(v.name)}">
            <div class="vendor-avatar">${v.logo_url ? `<img src="${esc(v.logo_url)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:9px">` : esc(v.name[0])}</div>
          </div>
          <div class="vendor-body">
            <div class="vendor-name">${esc(v.name)}</div>
            <div class="vendor-meta">${v.categories ? esc((v.categories.icon || '') + ' ' + v.categories.name) + ' · ' : ''}📍 ${esc(v.address || 'Rajkot')}</div>
            <div class="vendor-desc">${esc(v.description || 'Quality products from a local Rajkot business.')}</div>
          </div>
        </div>
      `).join('') + '</div>';
    }

    async function openVendor(vendorId) {
      state.currentVendor = state.vendors.find(v => v.id === vendorId) || null;
      if (!state.currentVendor) return;

      sectionTitle.textContent = state.currentVendor.name;
      backBtn.style.display = 'inline-flex';
      document.getElementById('catChips').style.display = 'none';
      content.innerHTML = '<div class="skeleton-grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>';
      window.scrollTo({ top: document.querySelector('.container').offsetTop - 70, behavior: 'smooth' });

      try {
        const res = await fetch('/api/marketplace?action=products&vendorId=' + encodeURIComponent(vendorId));
        state.products = await res.json();
        renderProducts();
      } catch (e) {
        content.innerHTML = '<div class="state">Could not load the menu. Please try again.</div>';
      }
    }

    function renderProducts() {
      const q = state.search.toLowerCase();
      const list = state.products.filter(p => !q || p.name.toLowerCase().includes(q) || (p.category || '').toLowerCase().includes(q));

      if (!list.length) {
        content.innerHTML = '<div class="state">No items found' + (q ? ' for "' + esc(q) + '"' : ' from this shop yet.') + '</div>';
        return;
      }

      content.innerHTML = '<div class="products-grid">' + list.map(p => {
        const out = typeof p.stock === 'number' && p.stock <= 0;
        const low = !out && typeof p.stock === 'number' && p.stock <= 5;
        return `
        <div class="product-card" style="${out ? 'opacity:0.6' : ''}">
          <div class="product-image">${p.image_url ? `<img src="${esc(p.image_url)}" alt="${esc(p.name)}">` : '🛍️'}</div>
          <div class="product-body">
            <div class="product-category">${esc(p.category || 'General')}</div>
            <div class="product-name">${esc(p.name)}</div>
            <div class="product-desc">${esc(p.description || '')}${low ? ' <span style="color:#d97706;font-weight:600">Only ' + p.stock + ' left!</span>' : ''}</div>
            <div class="product-footer">
              <div class="product-price">${inr(p.price)}</div>
              ${out
                ? '<span style="font-size:12px;font-weight:700;color:#dc2626">Out of stock</span>'
                : `<button class="add-btn" data-add="${p.id}">Add</button>`}
            </div>
          </div>
        </div>`;
      }).join('') + '</div>';
    }

    function addToCart(productId) {
      const p = state.products.find(x => String(x.id) === String(productId));
      if (!p || !state.currentVendor) return;

      const existing = state.cart.find(i => String(i.id) === String(p.id) && i.vendor_id === state.currentVendor.id);
      if (existing) existing.quantity++;
      else state.cart.push({
        id: p.id,
        name: p.name,
        price: Number(p.price),
        vendor_id: state.currentVendor.id,
        vendor_name: state.currentVendor.name,
        quantity: 1
      });

      localStorage.setItem('cart', JSON.stringify(state.cart));
      updateCartCount();
      toast(p.name + ' added to cart');
    }

    content.addEventListener('click', e => {
      const addBtn = e.target.closest('[data-add]');
      if (addBtn) return addToCart(addBtn.dataset.add);
      const card = e.target.closest('[data-vendor]');
      if (card) openVendor(card.dataset.vendor);
    });

    backBtn.addEventListener('click', () => {
      state.currentVendor = null;
      state.search = '';
      searchInput.value = '';
      renderVendors();
    });

    searchInput.addEventListener('input', () => {
      state.search = searchInput.value.trim();
      state.currentVendor ? renderProducts() : renderVendors();
    });

    loadMarketplace();
    updateCartCount();
  </script>
</body>
</html>
