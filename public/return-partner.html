<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Return Pickup Partner — Rajkot Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #e85d04; --primary-dark: #c44e03;
      --dark: #1e293b; --darker: #0f172a;
      --text: #334155; --muted: #64748b;
      --border: #e2e8f0; --bg: #f8fafc; --card: #ffffff;
      --green: #059669; --red: #dc2626; --amber: #d97706; --indigo: #4f46e5;
      --radius: 12px; --shadow: 0 1px 3px rgba(15,23,42,0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased;
    }

    /* Login screen */
    .login-screen {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 70%, #4f46e5 140%);
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .login-card {
      background: var(--card); border-radius: 16px; padding: 32px 28px;
      width: 100%; max-width: 360px; box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }
    .login-card h1 { font-size: 20px; font-weight: 800; color: var(--dark); text-align: center; }
    .login-card h1 span { color: var(--primary); }
    .login-card p { font-size: 13px; color: var(--muted); margin: 6px 0 20px; text-align: center; }
    .login-card label { display: block; font-size: 12px; font-weight: 700; color: var(--dark); margin: 12px 0 5px; }
    .login-card input {
      width: 100%; padding: 13px 14px; font-size: 15px;
      border: 1px solid var(--border); border-radius: 10px; font-family: inherit;
    }
    .login-card input:focus { outline: none; border-color: var(--primary); }
    .login-card button {
      width: 100%; margin-top: 18px; padding: 13px;
      background: var(--primary); color: #fff; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer;
    }
    .login-err { color: var(--red); font-size: 13px; font-weight: 600; margin-top: 12px; text-align: center; display: none; }

    /* App */
    .app { display: none; }
    .topbar { background: var(--darker); color: #fff; position: sticky; top: 0; z-index: 50; }
    .topbar-inner {
      max-width: 700px; margin: 0 auto; padding: 14px 16px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .brand { font-size: 17px; font-weight: 800; }
    .brand span { color: #fb923c; }
    .brand small { font-size: 10px; color: #94a3b8; margin-left: 8px; letter-spacing: 1px; }
    .who { font-size: 12px; color: #cbd5e1; margin-right: 10px; }
    .lock-btn {
      background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2);
      padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600;
      font-family: inherit; cursor: pointer;
    }
    .container { max-width: 700px; margin: 0 auto; padding: 18px 16px 50px; }
    .page-title { font-size: 15px; font-weight: 800; color: var(--dark); margin-bottom: 14px; }

    .dcard {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); border-left: 4px solid var(--indigo);
    }
    .dtop { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
    .oid { font-size: 14px; font-weight: 800; color: var(--dark); }
    .shop { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .restag {
      display: inline-block; font-size: 11px; font-weight: 800;
      padding: 4px 10px; border-radius: 999px; margin-top: 4px;
    }
    .res-refund { background: #d1fae5; color: #065f46; }
    .res-exchange { background: #dbeafe; color: #1e40af; }
    .res-na { background: #f1f5f9; color: #475569; }
    .reason { font-size: 12px; color: var(--text); background: var(--bg); border-radius: 8px; padding: 8px 10px; margin: 10px 0; }
    .reason b { color: var(--dark); }
    .items { font-size: 12px; color: var(--muted); margin: 8px 0; }
    .addr { background: var(--bg); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: var(--text); margin: 10px 0; }
    .addr b { color: var(--dark); }
    .addr a { color: var(--primary); text-decoration: none; font-weight: 700; }
    .addr .arow { padding: 1px 0; }
    .addr .alabel { display: inline-block; min-width: 92px; font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }

    .otp-row { display: flex; gap: 8px; margin-top: 10px; }
    .otp-row input {
      flex: 1; padding: 12px; text-align: center; font-size: 20px; letter-spacing: 6px; font-weight: 700;
      border: 1px solid var(--border); border-radius: 9px; font-family: inherit;
    }
    .otp-row input:focus { outline: none; border-color: var(--primary); }
    .btn-verify {
      padding: 12px 18px; background: var(--green); color: #fff; border: none; border-radius: 9px;
      font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer; white-space: nowrap;
    }
    .hint { font-size: 11px; color: var(--muted); margin-top: 8px; }
    .pickedup { display: inline-block; font-size: 12px; font-weight: 800; color: var(--green); margin-top: 10px; }
    .state { text-align: center; padding: 44px 16px; color: var(--muted); font-size: 14px; }

    /* Photo QC */
    .qc-wrap { margin-top: 12px; border-top: 1px dashed var(--border); padding-top: 12px; }
    .qc-head { font-size: 12px; font-weight: 800; color: var(--dark); margin-bottom: 10px; }
    .qc-product { margin-bottom: 12px; }
    .qc-pname { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .qc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .qc-tile {
      position: relative; aspect-ratio: 1; border: 1.5px dashed var(--border); border-radius: 9px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; overflow: hidden; background: var(--bg);
    }
    .qc-tile.done { border-style: solid; border-color: var(--green); }
    .qc-tile.uploading { opacity: 0.5; pointer-events: none; }
    .qc-tile img { width: 100%; height: 100%; object-fit: cover; }
    .qc-slot { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); }
    .qc-plus { font-size: 20px; color: var(--primary); line-height: 1; }
    .qc-progress { font-size: 11px; font-weight: 700; color: var(--muted); margin: 10px 0 8px; }
    .qc-actions { display: flex; gap: 8px; }
    .qc-pass, .qc-fail { flex: 1; padding: 12px; border: none; border-radius: 9px; font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer; }
    .qc-pass { background: var(--green); color: #fff; }
    .qc-pass:disabled { background: #cbd5e1; cursor: not-allowed; }
    .qc-fail { background: #fff; color: var(--red); border: 1px solid #fecaca; }

    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--dark); color: #fff; padding: 12px 22px; border-radius: 999px;
      font-size: 14px; font-weight: 600; transition: transform 0.25s; z-index: 200;
      max-width: calc(100vw - 32px); text-align: center;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    html { -webkit-text-size-adjust: 100%; }
    @media (max-width: 600px) { input, select, textarea { font-size: 16px; } }
  </style>
</head>
<body>
  <!-- Login gate -->
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <h1>Rajkot<span>Market</span></h1>
      <p>📦 Return Pickup Partner</p>
      <label for="loginId">Login ID</label>
      <input id="loginId" type="text" autocomplete="username" autocapitalize="off" spellcheck="false">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password">
      <button id="loginBtn">Sign in</button>
      <div class="login-err" id="loginErr">Wrong login id or password.</div>
    </div>
  </div>

  <!-- App -->
  <div class="app" id="app">
    <div class="topbar">
      <div class="topbar-inner">
        <div class="brand">Rajkot<span>Market</span><small>RETURNS</small></div>
        <div style="display:flex;align-items:center">
          <span class="who" id="who"></span>
          <button class="lock-btn" onclick="signOut()">Sign out</button>
        </div>
      </div>
    </div>
    <div class="container">
      <div class="page-title">📦 Pickups assigned to you</div>
      <div id="list"><div class="state">Loading…</div></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/call.js"></script>
  <script>
    let TOKEN = sessionStorage.getItem('rpToken') || '';
    let NAME = sessionStorage.getItem('rpName') || '';

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const inr = n => '₹' + Number(n || 0).toLocaleString('en-IN');

    function addrHtml(o) {
      if (!o) return '';
      const a = o.address_json;
      if (!a) return '📍 ' + esc(o.delivery_address || '');
      const row = (label, v) => v ? `<div class="arow"><span class="alabel">${label}</span> ${esc(v)}</div>` : '';
      return row('Flat/House', a.flat) + row('Building', a.building) + row('Street/Road', a.street)
        + row('Area', a.area) + row('Landmark', a.landmark)
        + row('City · PIN', a.city || a.pin ? [a.city, a.pin].filter(Boolean).join(' – ') : '')
        || ('📍 ' + esc(o.delivery_address || ''));
    }

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg; el.classList.add('show');
      clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2800);
    }

    async function api(action, extra) {
      const res = await fetch('/api/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...(TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {}) },
        body: JSON.stringify({ action, ...(extra || {}) })
      });
      const data = await res.json().catch(() => ({}));
      if (res.status === 401 && action !== 'rp-login') { signOut(); throw new Error(data.error || 'Session expired'); }
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    /* ---- Login ---- */
    async function signIn() {
      const loginId = document.getElementById('loginId').value.trim();
      const password = document.getElementById('password').value;
      const err = document.getElementById('loginErr');
      err.style.display = 'none';
      try {
        const d = await api('rp-login', { loginId, password });
        TOKEN = d.token; NAME = d.name || loginId;
        sessionStorage.setItem('rpToken', TOKEN);
        sessionStorage.setItem('rpName', NAME);
        enterApp();
      } catch (e) {
        err.textContent = e.message; err.style.display = 'block';
      }
    }
    document.getElementById('loginBtn').addEventListener('click', signIn);
    document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') signIn(); });

    function signOut() {
      TOKEN = ''; NAME = '';
      sessionStorage.removeItem('rpToken'); sessionStorage.removeItem('rpName');
      document.getElementById('app').style.display = 'none';
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('password').value = '';
    }

    function enterApp() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      document.getElementById('who').textContent = '👤 ' + NAME;
      loadList();
    }

    const SLOTS = ['top', 'bottom', 'left', 'right'];
    const photoFor = (r, pid, slot) => (r.photos || []).find(p => String(p.product_id) === String(pid) && p.slot === slot);

    // What to show once a pickup is confirmed: either the photo QC step (flagged
    // items) or a simple done message.
    function pickupBody(r) {
      const isExchange = r.request_type === 'exchange';
      const flagged = !!r.requires_photo_qc;

      // A RETURN with no photo QC just goes to the hub for the admin's refund gate.
      if (!isExchange && !flagged) return '<div class="pickedup">✅ Picked up — handed to the hub for refund approval.</div>';
      if (!isExchange && r.qc_status === 'passed') return '<div class="pickedup">✅ QC passed — awaiting refund approval.</div>';

      const need = r.qc_products || [];
      const have = (r.photos || []).filter(p => need.some(n => String(n.product_id) === String(p.product_id))).length;
      const total = need.length * 4;
      const complete = !flagged || (total > 0 && have >= total);   // non-flagged needs no photos
      const blocks = flagged ? need.map(p => `
        <div class="qc-product">
          <div class="qc-pname">📦 ${esc(p.name)}</div>
          <div class="qc-grid">
            ${SLOTS.map(s => {
              const ph = photoFor(r, p.product_id, s);
              return `<label class="qc-tile ${ph ? 'done' : ''}">
                ${ph ? `<img src="${esc(ph.url)}" alt="">` : `<span class="qc-slot">${s}</span><span class="qc-plus">＋</span>`}
                <input type="file" accept="image/*" capture="environment"
                  data-up-order="${esc(r.order_id)}" data-up-product="${esc(p.product_id)}" data-up-slot="${s}" hidden>
              </label>`;
            }).join('')}
          </div>
        </div>`).join('') : '';

      const passLabel = isExchange ? '✓ QC OK · hand over new item' : '✓ QC Pass';
      return `
        <div class="qc-wrap">
          <div class="qc-head">${isExchange ? '🔁 Exchange — inspect, then hand over the replacement' : '🔍 Photo inspection — all 4 angles per item'}</div>
          ${flagged ? blocks + `<div class="qc-progress">${have}/${total} photos captured</div>` : '<div class="hint" style="margin:6px 0 10px">No photo inspection required — just check the item\'s condition.</div>'}
          <div class="qc-actions">
            <button class="qc-fail" data-qc-fail="${esc(r.order_id)}">✗ QC Fail</button>
            <button class="qc-pass" data-qc-pass="${esc(r.order_id)}" ${complete ? '' : 'disabled'}>${passLabel}</button>
          </div>
          <div class="hint">${isExchange
            ? 'On QC OK, give the customer the replacement product now — the case closes as Exchanged.'
            : 'Check for wear, scratches or physical damage. Fail if the item is not in resellable condition.'}</div>
        </div>`;
    }

    async function uploadPhoto(file, orderId, productId, slot) {
      const sig = await api('rp-sign-upload', { orderId });
      const fd = new FormData();
      fd.append('file', file);
      fd.append('api_key', sig.apiKey);
      fd.append('timestamp', sig.timestamp);
      fd.append('signature', sig.signature);
      fd.append('folder', sig.folder);
      const res = await fetch(sig.uploadUrl, { method: 'POST', body: fd });
      const data = await res.json().catch(() => ({}));
      if (!data.secure_url) throw new Error((data.error && data.error.message) || 'Upload failed');
      await api('rp-save-photo', { orderId, productId, slot, publicId: data.public_id, url: data.secure_url });
    }

    /* ---- Assigned pickups ---- */
    async function loadList() {
      const el = document.getElementById('list');
      try {
        const rows = await api('rp-orders');
        if (!rows.length) {
          el.innerHTML = '<div class="state">No pickups assigned to you right now. 🎉</div>';
          return;
        }
        el.innerHTML = rows.map(r => {
          const o = r.order || {};
          const items = Array.isArray(o.items_json) ? o.items_json : [];
          const itemsLine = items.map(i => esc(i.name) + ' × ' + (i.quantity || i.qty || 1)).join(' · ');
          const isExchange = r.request_type === 'exchange';
          const resCls = isExchange ? 'res-exchange' : 'res-refund';
          const resTxt = isExchange ? '🔁 EXCHANGE' : '↩️ RETURN';
          return `
          <div class="dcard">
            <div class="dtop">
              <div>
                <div class="oid">${isExchange && r.exchange_id ? esc(r.exchange_id) : esc(r.order_id)}</div>
                <div class="shop">${isExchange && r.exchange_id ? 'order ' + esc(r.order_id) + ' · ' : ''}🏪 ${esc((o.vendors || {}).name || 'Shop')}</div>
                <span class="restag ${resCls}">${resTxt}</span>
              </div>
              <div style="text-align:right">
                <div style="font-size:16px;font-weight:800;color:var(--dark)">${inr(o.total)}</div>
              </div>
            </div>
            <div class="reason"><b>Reason:</b> ${esc(r.reason)}</div>
            ${itemsLine ? `<div class="items">📦 ${itemsLine}</div>` : ''}
            <div class="addr">
              <b>${esc(o.customer_name || r.customer_name || '')}</b> <span style="font-size:11px;color:var(--muted)">📞 number hidden for privacy</span>
              <div style="margin-top:6px">${addrHtml(o)}</div>
            </div>
            <button class="btn-verify" data-call="${esc(r.order_id)}" style="width:100%;background:var(--indigo);margin-bottom:4px">📞 Call customer</button>
            ${r.status === 'Assigned'
              ? `<div class="otp-row">
                   <input data-otp="${esc(r.order_id)}" type="text" inputmode="numeric" maxlength="6" placeholder="Pickup code">
                   <button class="btn-verify" data-verify="${esc(r.order_id)}">Confirm pickup</button>
                 </div>
                 <div class="hint">Ask the customer for the 6-digit pickup code shown in their RajkotMarket profile.</div>`
              : pickupBody(r)}
          </div>`;
        }).join('');
      } catch (e) {
        el.innerHTML = `<div class="state">${esc(e.message)}</div>`;
      }
    }

    // WebRTC voice call: signal over /api/feedback with the partner token.
    function rpSignal(action, body) {
      return fetch('/api/feedback', {
        method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN },
        body: JSON.stringify({ action, ...body })
      }).then(r => r.json());
    }

    document.getElementById('list').addEventListener('click', async e => {
      const call = e.target.closest('[data-call]');
      if (call) { if (window.RMCall && !RMCall.busy()) RMCall.call(call.dataset.call, rpSignal, 'customer'); return; }
      const v = e.target.closest('[data-verify]');
      const pass = e.target.closest('[data-qc-pass]');
      const fail = e.target.closest('[data-qc-fail]');

      if (pass) {
        const label = pass.textContent;
        pass.disabled = true; pass.textContent = 'Submitting…';
        try {
          const d = await api('rp-qc', { orderId: pass.dataset.qcPass, result: 'pass' });
          toast(d.status === 'Exchanged' ? 'Exchanged ✓ — replacement handed over' : 'QC passed ✓');
          loadList();
        } catch (err) { toast(err.message); pass.disabled = false; pass.textContent = label; }
        return;
      }
      if (fail) {
        const note = prompt('Reason for failing QC (wear / scratch / damage):');
        if (note === null) return;
        try { await api('rp-qc', { orderId: fail.dataset.qcFail, result: 'fail', note }); toast('QC failed — item returns to customer'); loadList(); }
        catch (err) { toast(err.message); }
        return;
      }

      if (!v) return;
      const orderId = v.dataset.verify;
      const input = document.querySelector(`[data-otp="${CSS.escape(orderId)}"]`);
      const otp = (input ? input.value : '').trim();
      if (!otp) { toast('Enter the pickup code first.'); return; }
      v.disabled = true;
      try {
        await api('rp-verify-otp', { orderId, otp });
        toast('Pickup confirmed ✓');
        loadList();
      } catch (err) {
        toast(err.message);
        v.disabled = false;
      }
    });

    // Capturing a QC photo: sign -> upload to Cloudinary -> record.
    document.getElementById('list').addEventListener('change', async e => {
      const inp = e.target.closest('[data-up-slot]');
      if (!inp || !inp.files || !inp.files[0]) return;
      const tile = inp.closest('.qc-tile');
      if (tile) tile.classList.add('uploading');
      try {
        await uploadPhoto(inp.files[0], inp.dataset.upOrder, inp.dataset.upProduct, inp.dataset.upSlot);
        toast('Photo saved');
        loadList();
      } catch (err) {
        toast(err.message);
        if (tile) tile.classList.remove('uploading');
      }
    });

    /* ---- Auto-resume + gentle refresh ---- */
    if (TOKEN) {
      api('rp-orders').then(() => enterApp()).catch(() => signOut());
    }
    setInterval(() => { if (TOKEN && document.getElementById('app').style.display === 'block') loadList(); }, 45000);
  </script>
</body>
</html>
